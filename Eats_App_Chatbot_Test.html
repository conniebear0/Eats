  const dishImage = (d, size, steam) => (d.photo ? `<img class="dish-img" style="width:${size}px;height:${size}px" src="${Core.img(d.photo)}" alt="${esc(d.name)}">` : plate(d.art, { steam, style: `width:${size}px` }));
  const stepper = (qty, minus, plus, size) => `<div class="stepper"><button class="circle-btn sm" style="width:${size}px;height:${size}px" ${minus} aria-label="Remove one">−</button><span class="label-l px10">${qty}</span><button class="circle-btn sm" style="width:${size}px;height:${size}px" ${plus} aria-label="Add one">+</button></div>`;
  const totalsLines = (t, pickup) => {
    const line = (l, v, hi) => `<div class="tline ${hi ? 'hi' : ''}"><span>${esc(l)}</span><span>${esc(v)}</span></div>`;

  function render(newScreen) {
    const root = $('#screen');

    if (app.user === null && SIGNED_IN.has(e.route)) { navigate('login', null, { clear: true }); return; }
    const active = document.activeElement && root.contains(document.activeElement) ? document.activeElement : null;
    const bind = active && active.dataset ? active.dataset.bind : null;
    const sel = bind && 'selectionStart' in active ? [active.selectionStart, active.selectionEnd] : null;
    const scrolls = {}; const hscroll = {};
    if (!newScreen) {
      scrollables(root).forEach(([key, el]) => { scrolls[key] = el.scrollTop; });
      root.querySelectorAll('.hrow').forEach((el, i) => { hscroll[i] = el.scrollLeft; });
    }
    if (app.dialog) refreshDialogBody();
    root.innerHTML = S[e.route](e) + sheetHtml() + dialogHtml() + snackHtml();
    root.dataset.route = e.route;
    scrollables(root).forEach(([key, el]) => { if (scrolls[key] != null) el.scrollTop = scrolls[key]; });
    root.querySelectorAll('.hrow').forEach((el, i) => { if (hscroll[i] != null && !el.classList.contains('qr')) el.scrollLeft = hscroll[i]; });
    if (bind) {
      const el = root.querySelector(`[data-bind="${bind}"]`);
      if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (_) { /* email inputs */ } }
    }
    if (e.route === 'chat') {
      const list = $('#chat-list');
      const ta = root.querySelector('[data-bind="input"]'); if (ta) autoGrow(ta);
      const count = Support.chat.items.length + (Support.chat.pendingAi !== null ? 1 : 0);
      if (newScreen || count !== lastChatCount || lastRoute !== 'chat') list.scrollTop = list.scrollHeight;
      lastChatCount = count;
    }
    if (e.route === 'restaurant') hookMenuScroll(e);
    lastRoute = e.route;
  }
  // Every area that scrolls up and down (the page, the dish sheet, a dialog) keeps its place when the
  // screen redraws after a tap. Keyed by screen + area, so a different screen still starts at the top.
  function scrollables(root) {
    const route = top().route + ':' + JSON.stringify(top().args || {});
    return Array.from(root.querySelectorAll('.scroll, .sheet-scroll, .dialog-body, .dialog-scroll'))
      .map((el, i) => [route + '|' + (el.dataset.scroll || el.className + '#' + i), el]);
  }
  function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 104) + 'px'; }
  function hookMenuScroll(e) {
    const sc = $('#rest-scroll'); if (!sc) return;
    sc.onscroll = () => {
      const heads = Array.from(sc.querySelectorAll('[data-section]'));
      const limit = sc.getBoundingClientRect().top + 120;
      let idx = 0; heads.forEach((h, i) => { if (h.getBoundingClientRect().top <= limit) idx = i; });
      if (idx !== (e.s.section || 0)) {
        e.s.section = idx;
        const chips = $('#menu-chips');
        chips.querySelectorAll('.fchip').forEach((c, i) => c.classList.toggle('on', i === idx));
        const chip = chips.children[idx]; if (chip) chips.scrollTo({ left: chip.offsetLeft - 20, behavior: 'smooth' });
      }
    };
  }

  function setTheme(m) { themeMode = m; Core.store.set('eats_theme', m); applyTheme(); }
  mq.addEventListener('change', () => { if (themeMode === 'System') applyTheme(); });

  // Re-render on data changes.
  Orders.listeners.push(() => render());
  Support.listeners.push(() => render());
  $('#reset-data').addEventListener('click', () => {
    if (!confirm('Delete all accounts, orders, complaints and what the bot learned in this browser?')) return;
    Core.store.clearAll(); location.reload();
  });
  setInterval(() => { const d = new Date(); $('#clock').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }, 10000);
  $('#clock').textContent = `${String(new Date().getHours()).padStart(2, '0')}:${String(new Date().getMinutes()).padStart(2, '0')}`;

  // Start: demo account, restore the session, splash.
  Core.Auth.seedDemo().then(() => {
    const u = Core.Auth.restore();
    if (u) signedIn(u);
    onEnter(top());
    applyTheme();
  });
  window.__eats = { app, Orders, Support, Core };
})();</script>
</body>
</html>
