          return result(reply('RefundStatus', [`Your refund request of ${Fmt.money(refund.amount)} was declined. If you think that's wrong, I can ask a supervisor to look at it again.`],
            { card, quickReplies: [qr(A('ChaseComplaint'), 'Ask a supervisor')], answered: true }), copy(s, { awaiting: W('Nothing') }));
        // (declined: the agent's note is on the complaint under My complaints)
      }
    }

    paymentProblem(text, state, ctx) {
      const kind = this.chargeKind(text, this.orderFor(state, ctx));
      if (kind) return this.chargeAnswer(kind, state, ctx);
      return result(reply('PaymentProblem', ["Let's sort that out. What do you see on your statement?"], {
        quickReplies: Object.values(ChargeKind).map((k) => qr(A('ChooseCharge', { kind: k }), k.label)),
      }), copy(state, { awaiting: W('ChargeWhat'), lastProblem: 'PaymentProblem' }));
    }

    chargeAnswer(kind, state, ctx) {
      const order = this.orderFor(state, ctx);
      const s = copy(state, { lastProblem: 'PaymentProblem' });
      if (kind === ChargeKind.Pending) {
        return result(reply('PaymentProblem', [
          "That's most likely a card authorisation hold. When a card is tapped, the bank can reserve the amount for a few days before it settles. It isn't a second charge, and the bank releases it, usually within 3 to 7 business days.",
          "If it hasn't dropped off after 7 days, tell me and I'll log it for our payments team.",
        ], { quickReplies: [qr(A('ChooseCharge', { kind: ChargeKind.Twice }), "It's a completed charge")], answered: true }), copy(s, { awaiting: W('Nothing') }));
      }
      const g = kind === ChargeKind.Unknown ? Guidelines.unauthorised : Guidelines.payment;
      const [sub, sev] = kind === ChargeKind.Twice ? ['Double Billing', Severity.Critical]
        : kind === ChargeKind.Unknown ? ['Unauthorised Deduction', Severity.Critical] : ['Incorrect Amount Charged', Severity.High];
      const texts = [
        "I've flagged this for our payments team" + (sev === Severity.Critical ? " as Critical, so it's looked at immediately." : '.'),
        "Please don't share card numbers or PINs here; we will never ask for your PIN." + (kind === ChargeKind.Unknown ? ' If you think someone else used your card, call your bank to block it.' : ''),
      ];
      const words = { Pending: 'pending amount', Twice: 'charged twice', Unknown: 'unrecognised charge', WrongAmount: 'wrong amount' }[kind.name];
      return this.escalate('PaymentProblem', texts, E(g.category, sub, sev, order ? order.id : null, order ? order.restaurantName : null,
        `Payment problem (${words})` + (order ? ` on order ${order.id}, total ${Fmt.money(order.total)}, paid by ${order.pay.label}` : '') + '.'), s, ctx);
    }

    // --- Support that did not help ---
    poorSupport(text, state, ctx) {
      const open = ctx.complaints.filter((c) => c.status.isOpen).slice().sort((a, b) => b.createdAt - a.createdAt);
      if (has(text, /\b(manager|supervisor|escalate|someone senior|higher up)\b/)) {
        if (open[0]) return this.chase(open[0], state, ctx);
        const o = this.orderFor(state, ctx);
        return this.escalate('PoorSupport', ["Of course. I've asked a supervisor to contact you. They'll get back to you within 24 hours, or you can call an agent now."],
          E(Category.CustomerService, 'Supervisor Requested', Severity.High, o ? o.id : null, o ? o.restaurantName : null, withWords('The customer asked for a supervisor.', text)),
          copy(state, { lastProblem: 'PoorSupport' }), ctx, [qr(A('Call'), 'Call an agent')]);
      }
      const od = open.find((c) => overdue(c, ctx.now));
      if (od) return this.chase(od, state, ctx);
      const latest = open[0];
      if (latest) {
        return result(reply('PoorSupport', [
          `I'm sorry for the wait. Your complaint ${reference(latest)} (${latest.subcategory}) is ${latest.status.label.toLowerCase()}, and a person will respond by ${Fmt.due(latest.dueAt, ctx.now)}.`,
          "If you can't wait, I can raise it to a supervisor now, or you can call an agent.",
        ], { quickReplies: [qr(A('ChaseComplaint'), 'Raise it to a supervisor'), qr(A('Call'), 'Call an agent')], answered: true }),
        copy(state, { awaiting: W('Nothing'), lastProblem: 'PoorSupport' }));
      }
      const order = this.orderFor(state, ctx);
      return this.escalate('PoorSupport', ["I'm sorry you've had trouble getting help. I've logged this for a supervisor as High priority."],
        E(Guidelines.poorSupport.category, Guidelines.poorSupport.subcategory, Guidelines.poorSupport.severity, order ? order.id : null, order ? order.restaurantName : null,
          withWords('The customer says support has not helped them.', text)),
        copy(state, { lastProblem: 'PoorSupport' }), ctx, [qr(A('Call'), 'Call an agent')]);
    }

    chase(c, state, ctx) {
      let text;
      if (c.refund && c.refund.status === RefundStatus.Declined && !c.status.isOpen) text = `I've asked a supervisor to look at your refund for ${reference(c)} again. They'll contact you within 24 hours.`;
      else if (c.escalated && !overdue(c, ctx.now)) text = `${reference(c)} is already with a supervisor, and they'll contact you by ${Fmt.due(c.dueAt, ctx.now)}. I'm sorry for the wait. You can also call an agent now.`;
      else text = `I'm sorry nobody has got back to you. I've raised ${reference(c)} to a supervisor as High priority, and they'll contact you within 24 hours.`;
      return result(reply('PoorSupport', [text], {
        chaseComplaintId: c.escalated && !overdue(c, ctx.now) && c.status.isOpen ? null : c.id,
        quickReplies: [pick('ComplaintStatus'), qr(A('Call'), 'Call an agent')], answered: true,
      }), copy(state, { awaiting: W('Nothing') }));
    }

    // --- Changes to an order ---
    freeCancel(order) { return order.state === OrderState.Received || (order.state.inProgress && order.minutesLate >= Guidelines.LATE_FREE_CANCEL_MINUTES); }

    cancelOrder(order, state, ctx) {
      const s = copy(state, { orderId: order.id, lastProblem: 'CancelOrder' });
      if (!order.active) return this.simple('CancelOrder', `You don't have an order in progress to cancel. Your last order from ${order.restaurantName} has already been ${order.state.label.toLowerCase()}.`, s, this.stageChips(order));
      if (this.freeCancel(order)) {
        return result(reply('CancelOrder', [
          order.state === OrderState.Received ? `${order.restaurantName} hasn't started on it yet, so I can cancel it now at no charge.` : 'Your order is running late, so I can cancel it free of charge.',
          'Shall I cancel it?',
        ], { card: this.orderCard(order), quickReplies: [qr(A('ConfirmCancel'), 'Yes, cancel it'), qr(A('KeepOrder'), 'No, keep it')] }), copy(s, { awaiting: W('CancelConfirm') }));
      }
      if (order.state === OrderState.Preparing && ctx.complaints.some((c) => c.orderId === order.id && c.status.isOpen && c.subcategory === Guidelines.cancel.subcategory)) {
        return this.simple('CancelOrder', `Your cancellation request is already with ${order.restaurantName} and our support team. They'll confirm shortly; I'll post here if your order changes.`, s, [pick('ComplaintStatus'), human()]);
      }
      if (order.state === OrderState.Preparing) {
        return result(reply('CancelOrder', [`${order.restaurantName} is already preparing your food, so I can only send them a cancellation request. They may charge for food that's already made. Send the request?`], {
          quickReplies: [qr(A('ConfirmCancel'), 'Yes, send the request'), qr(A('KeepOrder'), 'No, keep it')],
        }), copy(s, { awaiting: W('CancelConfirm') }));
      }
      if (order.state === OrderState.OnTheWay && state.cancelAsked && !order.pickup) {
        return this.simple('CancelOrder', "I understand you don't want it. Because it's already on its way I can't cancel it myself, but a person can look at it with you. " +
          "You pay on delivery, so nothing has been charged yet.", s, [human(), qr(A('Call'), 'Call an agent')]);
      }
      if (order.state === OrderState.OnTheWay) {
        return this.simple('CancelOrder', order.pickup ? "Your order is ready and waiting for you, so it can't be cancelled now."
          : `${order.driverName != null ? order.driverName : 'Your driver'} is already on the way with your order, so it can't be cancelled now. It'll be with you in about ${Fmt.minutes(order.minutesLeft != null ? order.minutesLeft : 1)}.`,
        copy(s, { cancelAsked: true }), [pick('ContactDriver'), human()]);
      }
      if (order.state === OrderState.Delivered) {
        return this.simple('CancelOrder', "This order has already been delivered, so it can't be cancelled. If something was wrong with it, tell me and I'll help put it right.", s, this.stageChips(order));
      }
      return this.cancelledOrder(order, s, []);
    }

    confirmCancel(order, state, ctx) {
      if (this.freeCancel(order)) {
        const texts = [`Done. Your order from ${order.restaurantName} is cancelled, and you won't be charged.`];
        const action = { type: 'Cancel', orderId: order.id };
        if (order.minutesLate > 0) {
          const r = this.escalate('CancelOrder', texts.concat(["I've also logged the delay so our logistics team can follow up."]),
            esc(Guidelines.late, order, `Order ${order.id} was cancelled by the customer after running ${order.minutesLate} min late.`), state, ctx);
          return result(copy(r.reply, { orderAction: action }), r.state);
        }
        return result(reply('CancelOrder', texts, { orderAction: action, quickReplies: [menu()], answered: true }), copy(state, { awaiting: W('Nothing') }));
      }
      if (order.state === OrderState.Preparing) {
        return this.escalate('CancelOrder', [`Request sent. ${order.restaurantName} and our support team will confirm shortly whether it can still be cancelled. I can't cancel orders that are being made myself.`],
          esc(Guidelines.cancel, order, `The customer asks to cancel order ${order.id} while ${order.restaurantName} is preparing it.`), state, ctx);
      }
      return this.cancelOrder(order, state, ctx);
    }

    changeAddress(order, state, text, ctx) {
      const s = copy(state, { orderId: order.id, lastProblem: 'ChangeAddress' });
      if (!order.active || !order.state.inProgress) return this.simple('ChangeAddress', "This order is already finished, so its address can't be changed. For your next order, update your address under Profile or at checkout.", s, []);
      if (order.pickup) return this.simple('ChangeAddress', "This is a pick-up order, so there's no delivery address to change.", s, this.stageChips(order));
      const inline = this.addressIn(text || '');
      if (order.state === OrderState.OnTheWay) {
        return this.simple('ChangeAddress', `${order.driverName != null ? order.driverName : 'Your driver'} is already on the way to ${order.address}, so I can't change it from here. ` +
          (inline ? `I can ask them to call you so you can direct them to ${inline}, or a person can help redirect it.` : 'I can ask them to call you, or a person can help redirect it.'), s, [pick('ContactDriver'), human()]);
      }
      if (inline) return this.newAddress(order, inline, s, ctx);
      return result(reply('ChangeAddress', [`Your order is going to ${order.address}. Type the full new address and I'll update it before your driver sets off.`], {
        quickReplies: [qr(A('KeepOrder'), 'Keep this address')],
      }), copy(s, { awaiting: W('NewAddress') }));
    }

    /** "change my address to 5 Beach Road, Gonubie" -> "5 Beach Road, Gonubie" (needs a street number). */
    addressIn(text) {
      const parts = text.trim().split(/\b(?:to|is|address|at)\b:?/i);
      for (let i = parts.length - 1; i >= 1; i--) {
        const p = parts[i].replace(/\b(instead|please|thanks|thank you|now)\b\.?/gi, '').replace(/[.!?]+$/, '').replace(/^[\s:,-]+|[\s,]+$/g, '');
        if (/\d/.test(p) && this.looksLikeAddress(p)) return p.slice(0, MAX_ADDRESS);
      }
      return null;
    }

    newAddress(order, text, state, ctx) {
      if (!order.active || order.state === OrderState.OnTheWay || !order.state.inProgress) return this.changeAddress(order, state);
      const address = text.trim().replace(/^(its|it's|it is|the address is|address is|my address is|deliver to|send it to)\s+/i, '').replace(/[.!]+$/, '').slice(0, MAX_ADDRESS);
      if (!this.looksLikeAddress(address)) {
        return result(reply('ChangeAddress', ["That doesn't look like a full address. Please include the street number, street name and suburb, e.g. 12 Oxford Street, Quigney."], {
          quickReplies: [qr(A('KeepOrder'), 'Keep the old address')],
        }), copy(state, { awaiting: W('NewAddress') }));
      }
      return result(reply('ChangeAddress', [`Updated. Your order will now go to ${address}, and your driver will see the new address.`], {
        orderAction: { type: 'ChangeAddress', orderId: order.id, address }, quickReplies: [pick('WhereIsOrder')], answered: true,
      }), copy(state, { awaiting: W('Nothing') }));
    }

    modifyOrder(order, state) {
      const s = copy(state, { orderId: order.id });
      if (order.active && order.state === OrderState.Received) {
        return this.simple('ModifyOrder', `Orders can't be changed once they're placed, but ${order.restaurantName} hasn't started yet. I can cancel it at no charge so you can order again with the right items.`,
          s, [pick('CancelOrder'), qr(A('KeepOrder'), 'No, keep it')]);
      }
      return this.simple('ModifyOrder', order.active && order.state.inProgress
        ? `${order.restaurantName} is already working on your order, so it can't be changed. You're welcome to place a separate order for anything extra.`
        : "That order is finished, so it can't be changed. You can order again from the Orders tab.", s, this.stageChips(order));
    }

    contactDriver(order, state, text) {
      const s = copy(state, { orderId: order.id });
      const q = text || '';
      const name = order.driverName != null ? order.driverName : 'Your driver';
      if (!order.pickup && order.active && order.state === OrderState.OnTheWay && has(q, /\b(not answering|isnt answering|wont answer|doesnt answer|no answer|not picking up|cant reach|cant get hold|unreachable|phone off)\b/)) {
        return this.simple('ContactDriver', `I'm sorry ${name} isn't answering. Drivers can't take calls while they're riding, so they'll usually call back when they stop. They're about ${Fmt.minutes(order.minutesLeft != null ? order.minutesLeft : 1)} away. ` +
          "If you still can't reach them, a person can contact them for you.", s, [human(), pick('WhereIsOrder')], true);
      }
      if (!order.pickup && order.active && order.state === OrderState.OnTheWay && has(q, /\b(lost|cant find|cannot find|driving around|wrong way|circles)\b/)) {
        return this.simple('ContactDriver', `I've asked ${name} to call you so you can guide them in. Please keep your phone nearby. They're about ${Fmt.minutes(order.minutesLeft != null ? order.minutesLeft : 1)} away.`,
          s, [pick('DeliveryInstructions'), human()], true);
      }
      let text2;
      if (order.pickup) text2 = `This is a pick-up order, so there's no driver. Your food will be waiting at ${order.restaurantName}, ${order.restaurantArea}.`;
      else if (order.active && order.state === OrderState.OnTheWay) {
        text2 = `Your driver is ${order.driverName != null ? order.driverName : 'on the way'}` + (order.driverVehicle != null ? ` (${order.driverVehicle})` : '') +
          `. I've sent them a message to call you on the number on your profile. They're about ${Fmt.minutes(order.minutesLeft != null ? order.minutesLeft : 1)} away.`;
      } else if (order.active && order.state.inProgress) text2 = "A driver is assigned when your food is nearly ready. You'll see their name on the tracking screen, and I'll post an update here when they pick it up.";
      else if (order.state === OrderState.Delivered) text2 = `${order.driverName != null ? order.driverName : 'Your driver'} delivered this order. If something went wrong with the delivery, tell me and I'll help.`;
      else text2 = 'This order was cancelled, so no driver is assigned.';
      return this.simple('ContactDriver', text2, s, this.stageChips(order), true);
    }

    driverIssue(order, text, state, ctx) {
      const t = TextNormaliser.normalise(text);
      const words = TextNormaliser.tokens(text);
      const money = hasAny(words, S('money', 'cash', 'extra', 'more', 'paid', 'pay', 'demanded', 'charged', 'tip', 'tips'));
      const unsafe = hasAny(words, UNSAFE) || t.includes('cant breathe');
      let sub; let sev; let texts;
      if (unsafe) {
        sub = 'Driver Conduct (Safety)'; sev = Severity.High;
        texts = ["I'm sorry, that's not okay. If you feel unsafe right now, please call the police on 10111.", "I've reported the driver to our logistics team as High priority, and they'll follow it up with you."];
      } else if (money) {
        sub = 'Driver Asked For Extra Money'; sev = Severity.High;
        texts = ['Drivers must never ask for extra money: the amount in the app is all you owe (tips are optional and set at checkout).',
          "I've reported this to our logistics team as High priority. If you paid extra, tell the agent how much and they'll look at getting it back."];
      } else {
        sub = Guidelines.driver.subcategory; sev = Guidelines.driver.severity;
        texts = ["I'm sorry about your driver's behaviour. That's not the service we expect. I've reported it to our logistics team so they can follow it up with the driver."];
      }
      return this.escalate('DriverIssue', texts, E(Category.DriverConduct, sub, sev, order ? order.id : null, order ? order.restaurantName : null,
        withWords('Driver complaint' + (order && order.driverName != null ? ` about ${order.driverName}` : '') + '.', text)), copy(state, { lastProblem: 'DriverIssue' }), ctx);
    }

    // --- Questions ---
    orderDetails(order, state) {
      return result(reply('OrderDetails', [`Here's your ${order.active ? 'current' : 'last'} order from ${order.restaurantName}, placed ${Fmt.dateTime(order.placedAt)}.`], {
        card: {
          title: `Order ${order.id}`,
          rows: order.lines.map((l) => [`${l.qty}× ${l.name}`, Fmt.money(l.total)]).concat([
            ['Total', Fmt.money(order.total)],
            ['Payment', capFirst(order.pay.label) + (order.pickup ? ' at pick-up' : ' on delivery')],
            ['Status', order.state.label],
          ]),
        },
        quickReplies: this.stageChips(order), answered: true,
      }), copy(state, { orderId: order.id, awaiting: W('Nothing') }));
    }

    fees(order, state) {
      const texts = [Guidelines.FEES];
      if (order && !order.pickup) {
        texts.push(`${order.restaurantName}'s delivery fee is ${Fmt.money(order.deliveryFee)}` + (order.freeDeliveryOver > 0 ? `, and it's free on orders over ${Fmt.money(order.freeDeliveryOver)}.` : '.'));
      }
      return result(reply('Fees', texts, { quickReplies: [pick('Promo'), menu()], answered: true }), copy(state, { awaiting: W('Nothing') }));
    }

    deliveryInstructions(order, state, text) {
      const q = text || '';
      if (order && order.active && order.state.inProgress && !order.pickup) {
        const note = q.trim().replace(/^(please |can you |could you )?(tell|ask) (the |my )?(driver|him|her|them) (to |that )?/i, '').replace(/[.!]+$/, '');
        const isNote = !has(q, /\b(how|where do|can i add|what are|what is)\b/) && note.length >= 4 &&
          has(q, /\b(code|gate|reception|door|flat|unit|block|complex|estate|buzz|intercom|guard|security|call|knock|ring|hoot|leave|park|dog|stairs|floor|house|blue|green|red|white|next to|opposite|behind)\b/);
        if (isNote) {
          const who = order.state === OrderState.OnTheWay && order.driverName != null ? order.driverName : 'your driver';
          return this.simple('DeliveryInstructions', `Done. I've passed this note to ${who}: "${note.slice(0, 160)}".` +
            (order.state === OrderState.OnTheWay ? '' : " They'll see it when they collect your order."), copy(state, { orderId: order.id }), [pick('WhereIsOrder')], true);
        }
        return this.simple('DeliveryInstructions', "Instructions are added at checkout, but your order is already placed. Tell me what the driver needs to know (like a gate code or where to leave it) and I'll pass it on.",
          copy(state, { orderId: order.id }), [pick('ContactDriver')], true);
      }
      return this.info('DeliveryInstructions', Guidelines.INSTRUCTIONS, state);
    }

    promo(text, state) {
      if (has(text, /\b(for the trouble|for my trouble|compensat\w*|make up for|goodwill|for the inconvenience|something for|credit for|voucher for|discount for)\b/)) {
        return this.simple('Promo', "I'm sorry for the trouble. Credits for a bad experience are decided by a support agent, not by me. If something went wrong with your order, tell me what happened and I'll log it with your request, so the agent can look at both together.",
          state, [pick('MissingItem'), pick('FoodQuality'), pick('Late'), human()], true);
      }
      if (has(text, /\b(not working|doesnt work|isnt working|wont work|invalid|error|failed|rejected|not valid|expired|not accepted|didnt work)\b/)) {
        return this.simple('Promo', 'Sorry about that. Please check that the code is typed exactly (for example EATSFIRST), that you add it in the cart before checkout, and that it applies to you: EATSFIRST is for first orders only, and you can use one code per order. ' +
          "If it still won't work, a person can check it for you.", state, [human(), menu()], true);
      }
      return this.info('Promo', Guidelines.PROMO, state);
    }

    tip(order, state) {
      if (order && order.active && order.state.inProgress && !order.pickup) {
        return this.info('Tip', "Your tip was set at checkout and can't be changed once the order is placed. You're welcome to give your driver a cash tip at the door, and 100% of tips go to them.", state);
      }
      return this.info('Tip', Guidelines.TIP, state);
    }

    payMethods(text, state) {
      if (has(text, /\b(snapscan|zapper|eft|instant eft|ozow|apple pay|google pay|samsung pay|paypal|online|mobicred|payflex|crypto|bitcoin|voucher)\b/)) {
        return this.info('PaymentMethods', "Not yet. eats takes cash or card when your food arrives (or when you collect it). Online payments like SnapScan, Zapper and EFT aren't available yet.", state);
      }
      return this.info('PaymentMethods', Guidelines.PAY, state);
    }

    pickup(order, state, text, ctx) {
      if (order && order.active && order.pickup && order.state.inProgress && has(text || '', /\b(cant find|cannot find|dont have|doesnt have|not ready|isnt ready|no order|never got|lost|wrong|closed|waiting|says|told me)\b/)) {
        return this.escalate('Pickup', [`Sorry about that. Please show them your order number, ${order.id}, under the name ${ctx.firstName}.`,
          `I've also alerted ${order.restaurantName} and our support team, so a person will help you right away. You only pay once you have your food.`],
        E(Category.OrderChange, 'Pick-up Problem', Severity.High, order.id, order.restaurantName, withWords(`The customer is at ${order.restaurantName} to collect order ${order.id} and there is a problem.`, text)),
        copy(state, { orderId: order.id }), ctx, [qr(A('Call'), 'Call an agent')]);
      }
      if (order && order.active && order.pickup && order.state.inProgress) {
        const pay = `Pay by ${order.pay.label} when you collect it.`;
        const text = order.state === OrderState.OnTheWay ? `It's ready now at ${order.restaurantName}, ${order.restaurantArea}. ${pay}`
          : `Collect it from ${order.restaurantName}, ${order.restaurantArea}. It'll be ready in about ${Fmt.minutes(order.minutesLeft != null ? order.minutesLeft : 1)}, and I'll post here when it is. ${pay}`;
        return result(reply('Pickup', [text], { card: this.orderCard(order), quickReplies: this.stageChips(order), answered: true }), copy(state, { orderId: order.id, awaiting: W('Nothing') }));
      }
      return this.info('Pickup', Guidelines.PICKUP, state);
    }

    account(text, state, ctx) {
      if (has(text, /\b(delete|close|remove|deactivate|cancel) (my )?account\b/)) {
        const o = null;
        return this.escalate('Account', ["I can't delete accounts myself, so I've passed your request to our team. They'll confirm with you before anything is removed."],
          E(Category.CustomerService, 'Account Deletion Request', Severity.Low, o, o, withWords('The customer asked for their account to be deleted.', text)), state, ctx);
      }
      if (has(text, /\b(email|e mail|phone number|mobile number|cell number|my number|name)\b/) && has(text, /\b(change|update|wrong|new)\b/)) {
        return this.escalate('Account', ['For your security, a person changes email addresses and phone numbers. I\'ve logged the request, and they\'ll contact you to confirm it\'s you.'],
          E(Category.CustomerService, 'Account Details Change', Severity.Low, null, null, withWords('The customer wants to change their account details.', text)), state, ctx);
      }
      if (has(text, /\b(password|log ?in|sign ?in|locked)\b/)) {
        return this.info('Account', 'To reset your password, sign out, tap "Forgot password?" on the login screen and enter your email or mobile number. We\'ll give you a 6-digit code to set a new one. After 5 wrong tries, sign-in pauses for 30 seconds.', state);
      }
      return this.info('Account', Guidelines.ACCOUNT, state);
    }

    smallTalk(text, state, ctx) {
      const order = this.orderFor(state, ctx);
      const chips = order && order.active ? this.stageChips(order) : menuChips();
      let t;
      if (has(text, /\b(who are you|what are you|bot|robot|human|real person|are you real|your name|talking to|ai)\b/)) {
        t = "I'm the eats virtual assistant: an automated helper, not a person. I can track your order and sort out most problems straight away, like missing or wrong food, refunds and charges. If you'd rather talk to a person, just say so.";
        return result(reply('SmallTalk', [t], { quickReplies: [human()].concat(chips) }), copy(state, { awaiting: W('Nothing') }));
      }
      if (has(text, /\b(what can you do|what can you help|what do you do|how can you help)\b/)) {
        t = 'I can track your order, cancel it or change the address while that is still possible, sort out missing, wrong or poor-quality food, chase refunds, check charges, update you on complaints, and answer questions about fees, promos and payments.';
      } else if (has(text, /\b(how are you|hows it going|how is it going|whats up)\b/)) {
        t = "I'm good, thanks for asking! How can I help with your order today?";
      } else if (has(text, /\b(good bot|love you|you are great|youre great|amazing|well done)\b/)) {
        t = 'Thank you, that\'s kind! Anything else I can help with?';
      } else if (has(text, /\bjoke\b/)) {
        t = "I'll leave the jokes to the comedians, but I'm very good at finding lost food. Anything I can help with on an order?";
      } else {
        t = "I can only help with eats orders and your account, so I'll have to leave that one. Is there anything I can help with on an order?";
      }
      return result(reply('SmallTalk', [t], { quickReplies: chips }), copy(state, { awaiting: W('Nothing') }));
    }

    ack(state, ctx) {
      const c = this.newestOpen(ctx);
      const text = c && ctx.now - c.createdAt <= HOUR
        ? `Okay. ${reference(c)} is with our team, and you can follow it under My complaints. Anything else I can help with?`
        : 'Okay! Anything else I can help with?';
      return this.done('Ack', text, state);
    }

    serviceInfo(text, state) {
      let t;
      if (has(text, /\b(close|open|hours|closing|opening|trading)\b/)) {
        t = `Restaurants set their own opening hours, shown on each restaurant's page. Our support team is available ${Guidelines.SUPPORT_HOURS}, and I'm here any time.`;
      } else if (has(text, /\b(minimum|min order|smallest)\b/)) {
        t = "There's no minimum order. Small orders just pay the restaurant's delivery fee and the R6 service fee.";
      } else if (has(text, /\b(halal|vegan|vegetarian|kosher|plant based|meat free)\b/)) {
        t = "Each restaurant sets its own menu, and dish descriptions list the main ingredients. For halal, vegan or vegetarian needs, check the dish description, add a note for the kitchen, or ask the restaurant before you order.";
      } else if (has(text, /\b(how does|how do i order|how it works)\b/)) {
        t = 'Pick a restaurant, add dishes to your cart and check out. You pay cash or card when the food arrives, and you can follow it live on the tracking screen.';
      } else {
        const m = /\b(?:to|in)\s+([A-Za-z][A-Za-z\s-]{2,30})\??$/.exec(text.trim());
        const place = m ? m[1].trim() : null;
        t = 'We deliver around East London, including areas like Quigney, Vincent, Southernwood, Berea, Nahoon and Beacon Bay. ' +
          (place ? `To check ${place}, set it as your delivery address on Home: you'll see every restaurant that delivers there.` : "Set your delivery address on Home and you'll see every restaurant that delivers there.");
      }
      return this.info('ServiceInfo', t, state);
    }

    willBeCharged(order, state, ctx) {
      if (!order) return this.info('WillBeCharged', Guidelines.PAY, state);
      const s = copy(state, { orderId: order.id });
      if (order.state === OrderState.Cancelled) return this.info('WillBeCharged', `No. Your order from ${order.restaurantName} was cancelled, and because you pay on delivery you won't be charged anything.`, s);
      const requested = ctx.complaints.some((c) => c.orderId === order.id && c.status.isOpen && c.subcategory === Guidelines.cancel.subcategory);
      if (requested && order.state.inProgress) {
        return this.info('WillBeCharged', `Your cancellation request is with ${order.restaurantName}. If they've already made the food they may charge for it, and the agent will tell you before anything is charged. You pay on delivery, so nothing has been taken yet.`, s);
      }
      if (order.state.inProgress) return this.info('WillBeCharged', `You're only charged when your order arrives: ${Fmt.money(order.total)} by ${order.pay.label}${order.pickup ? ' at pick-up' : ' on delivery'}. Nothing has been taken yet.`, s);
      return result(reply('WillBeCharged', [`You paid ${Fmt.money(order.total)} by ${order.pay.label}${order.pickup ? ' at pick-up' : ' on delivery'} for your order from ${order.restaurantName}. If you see a different amount or a second charge, tell me and I'll sort it out.`],
        { quickReplies: [pick('PaymentProblem')], answered: true }), copy(s, { awaiting: W('Nothing') }));
    }

    /** "the bakery order", "yesterday's order", "E-4802" -> that order, if only one fits. */
    orderFromText(text, ctx) {
      const n = TextNormaliser.normalise(text || '');
      if (n === '') return null;
      const byId = ctx.orders.find((o) => n.includes(o.id.toLowerCase().replace('-', ' ')) || n.includes(o.id.toLowerCase().replace('-', '')));
      if (byId) return byId;
      let list = ctx.orders;
      const words = TextNormaliser.tokens(text);
      const named = list.filter((o) => TextNormaliser.tokens(o.restaurantName).filter((w) => w.length >= 4 && !['and', 'the', 'kitchen', 'house'].includes(w))
        .some((w) => words.some((x) => TokenMatcher.matches(x, w))));
      if (named.length) list = named;
      const today = dayNumber(ctx.now);
      let dated = null;
      if (/\b(today|tonight|this morning|this afternoon|this evening|earlier)\b/.test(n)) dated = list.filter((o) => dayNumber(o.placedAt) === today);
      else if (/\b(yesterday|last night)\b/.test(n)) dated = list.filter((o) => dayNumber(o.placedAt) === today - 1);
      else if (/\blast week\b/.test(n)) dated = list.filter((o) => today - dayNumber(o.placedAt) >= 2);
      if (dated && dated.length) list = dated;
      if ((named.length || (dated && dated.length)) && list.length === 1) return list[0];
      // the items they mention ("the burger", "the shake") show which order it was
      const byItems = list.filter((o) => this.findItems(text, o).length > 0);
      if (byItems.length === 1) return byItems[0];
      return null;
    }

    rate(order, state) {
      let text;
      if (order.rating > 0) text = `You rated your order from ${order.restaurantName} ${order.rating} star${order.rating > 1 ? 's' : ''}. Thanks, it helps other customers.`;
      else if (order.active && order.state === OrderState.Delivered) text = `Scroll down on the tracking screen and tap the stars to rate your order from ${order.restaurantName}.`;
      else text = Guidelines.RATE;
      return this.simple('Rate', text, state, [], true);
    }

    info(intent, text, state) { return result(reply(intent, [text], { quickReplies: [menu()], answered: true }), copy(state, { awaiting: W('Nothing') })); }

    // --- Complaints and people ---
    complaintStatus(state, ctx) {
      const open = ctx.complaints.filter((c) => c.status.isOpen).slice().sort((a, b) => b.createdAt - a.createdAt);
      if (open.length === 0) {
        const last = maxBy(ctx.complaints, (c) => c.createdAt);
        const text = last === null ? "You don't have any complaints with us. Is something wrong with an order?"
          : `You have no open complaints. Your latest, ${reference(last)} (${last.subcategory}), is ${last.status.label.toLowerCase()}.`;
        return result(reply('ComplaintStatus', [text], { quickReplies: (last ? [this.viewChip(last)] : []).concat(menuChips().slice(0, 4)), answered: true }), copy(state, { awaiting: W('Nothing') }));
      }
      const c = open[0];
      const lines = [open.length === 1 ? 'You have one open complaint.' : `You have ${open.length} open complaints. The latest:`];
      lines.push(`${reference(c)}: ${c.subcategory}, ${c.severity.label} priority. It's ${c.status.label.toLowerCase()}` + (
        c.severity === Severity.Critical ? ', and a person is handling it now.'
          : overdue(c, ctx.now) ? ", and it's overdue. I can raise it to a supervisor." : `, and a person will respond by ${Fmt.due(c.dueAt, ctx.now)}.`));
      const chips = open.slice(0, 3).map((x) => this.viewChip(x)).concat(overdue(c, ctx.now) && c.severity !== Severity.Critical ? [qr(A('ChaseComplaint'), 'Raise it to a supervisor')] : []);
      return result(reply('ComplaintStatus', lines, { card: this.complaintCard(c, ctx.now), quickReplies: chips, answered: true }), copy(state, { awaiting: W('Nothing') }));
    }

    handOff(text, state, ctx) {
      const order = this.orderFor(state, ctx);
      const g = state.lastProblem ? this.guidelineFor(state.lastProblem) : null;
      return this.escalate('TalkToHuman', ["No problem. I'm handing this conversation to a person, so you won't have to repeat yourself."],
        E(g ? g.category : Category.CustomerService, g ? g.subcategory : 'Customer Asked For A Person', g ? g.severity : Severity.Medium,
          order ? order.id : null, order ? order.restaurantName : null, withWords('The customer asked to speak to a person.', text)),
        state, ctx, [qr(A('Call'), 'Call an agent')]);
    }

    callAgent(state) {
      return result(reply('CallAgent', [`You can call one of our agents now. Support is open ${Guidelines.SUPPORT_HOURS}.`], {
        quickReplies: [qr(A('Call'), 'Call an agent'), human()], answered: true,
      }), copy(state, { awaiting: W('Nothing') }));
    }

    correction(state) {
      return result(reply('Correction', ["Sorry, I got that wrong. What did you mean? Pick one of these and I'll remember it for next time."], {
        quickReplies: menuChips().concat([human()]),
      }), copy(state, { awaiting: W('Nothing') }));
    }

    greeting(state, ctx) {
      const order = this.orderFor(state, ctx);
      const chips = order && order.active ? this.stageChips(order) : menuChips();
      return result(reply('Greeting', [`Hi ${ctx.firstName}, what can I help with? Tap one of these or tell me in your own words.`], { quickReplies: chips }), copy(state, { awaiting: W('Nothing') }));
    }

    done(intent, text, state) {
      return result(reply(intent, [text], { quickReplies: [qr(A('Pick', { intent: 'Goodbye' }), "No, that's all"), qr(A('Menu'), 'Something else')] }), copy(state, { awaiting: W('Nothing') }));
    }

    noOrder(intent, state) {
      const text = ['WhereIsOrder', 'NeverArrived', 'Late', 'CancelOrder', 'ChangeAddress', 'ContactDriver'].includes(intent)
        ? "I can't see an order on this account yet. If you've just ordered, check you're signed in with the account you used; orders show here as soon as they're placed. You haven't been charged, because you only pay on delivery."
        : "I can't see any orders on your account yet. Once you place one, I can track it and help with any problem.";
      return result(reply(intent, [text], { quickReplies: [pick('Fees'), pick('PaymentMethods'), human()] }), copy(state, { awaiting: W('Nothing') }));
    }

    askWhichOrder(intent, text, state, ctx) {
      return result(reply(intent, ['Which order is this about?'], { quickReplies: ctx.orders.slice(0, 3).map((o) => qr(A('ChooseOrder', { orderId: o.id }), this.orderLabel(o))) }),
        copy(state, { awaiting: W('OrderChoice', { intent, text }) }));
    }

    // --- Buttons ---
    onChoice(action, state, ctx) {
      const order = this.orderFor(state, ctx);
      const a = state.awaiting;
      switch (action.type) {
        case 'Pick': {
          if (action.intent === 'OrderDetails' && a.type === 'OrderChoice') {
            const earlier = ctx.orders.filter((o) => !o.active);
            if (earlier.length === 1) return this.onChoice(A('ChooseOrder', { orderId: earlier[0].id }), state, ctx);
            return result(reply(a.intent, ['Which order is this about?'], { quickReplies: earlier.slice(0, 3).map((o) => qr(A('ChooseOrder', { orderId: o.id }), this.orderLabel(o))) }), state);
          }
          return this.onIntent(action.intent, '', copy(state, { awaiting: W('Nothing') }), ctx);
        }
        case 'ChooseOrder': {
          const intent = a.type === 'OrderChoice' ? a.intent : 'OrderDetails';
          const text = a.type === 'OrderChoice' ? a.text : '';
          return this.onIntent(intent, text, copy(state, { orderId: action.orderId, awaiting: W('Nothing') }), ctx);
        }
        case 'ChooseItem': {
          const everything = action.index === -1;
          if (!order || (!everything && (action.index < 0 || action.index >= order.lines.length))) return this.greeting(state, ctx);
          if (a.type === 'MissingWhich') return everything ? this.neverArrived(order, state, ctx, '') : this.chooseMissing(order, action.index, state, a.tamper);
          if (a.type === 'WrongWhich') return everything ? this.onChoice(A('WholeOrderWrong'), state, ctx) : this.wrongItems(order, [action.index], state);
          if (a.type === 'QualityWhich') return this.qualityAction(order, a.kind, everything ? order.lines.map((_, i) => i) : [action.index], state);
          return everything ? this.neverArrived(order, state, ctx, '') : this.chooseMissing(order, action.index, copy(state, { awaiting: W('MissingWhich') }));
        }
        case 'ChooseQty': return order && a.type === 'MissingHowMany' ? this.missingAction(order, [{ index: a.index, qty: action.qty }], state, a.tamper) : this.greeting(state, ctx);
        case 'ChooseQuality': return order ? this.chooseQuality(order, action.kind, state, a.type === 'QualityWhat' ? (a.indexes || []) : []) : this.greeting(state, ctx);
        case 'FollowUpYes':
          if (a.type !== 'FollowUpOffer') return this.greeting(state, ctx);
          return this.onIntent(a.intent, a.text, copy(state, { awaiting: W('Nothing') }), ctx);
        case 'FollowUpNo': return this.done('Thanks', 'No problem. Anything else I can help with?', state);
        case 'ChooseCharge': return this.chargeAnswer(action.kind, state, ctx);
        case 'ChooseMethod': {
          if (a.type !== 'RefundMethodChoice') return this.greeting(state, ctx);
          const e = copy(a.escalation, { refundMethod: action.method });
          return this.escalate(this.intentFor(e.category), [`I've asked for ${Fmt.money(e.refund ? e.refund.amount : 0)} ${action.method.label}. A support agent reviews every refund (I can't approve them myself). Once approved, it arrives ${action.method.timing}.`], e, state, ctx);
        }
        case 'OpenComplaint': return this.complaintStatus(state, ctx);
        case 'WholeOrderWrong':
          if (!order) return this.greeting(state, ctx);
          return result(reply('WrongOrder', ["If you have allergies, please don't eat food that isn't yours.", `Would you like a full refund of ${Fmt.money(order.total)}, or the correct order delivered?`], {
            quickReplies: [qr(A('FullRefund'), `Full refund ${Fmt.money(order.total)}`), qr(A('Redeliver'), 'Redeliver my order')],
          }), copy(state, { orderId: order.id, awaiting: W('WrongAction', { indexes: null }) }));
        case 'SomeItemsWrong':
          if (!order) return this.greeting(state, ctx);
          return result(reply('WrongOrder', ['Which item was wrong?'], { quickReplies: this.itemChips(order) }), copy(state, { awaiting: W('WrongWhich') }));
        case 'FullRefund':
          if (!order) return this.greeting(state, ctx);
          return this.refundFlow(esc(Guidelines.wrong, order, `The whole order ${order.id} from ${order.restaurantName} was wrong. The customer asks for a full refund.`, { amount: order.total, reason: 'Whole order wrong' }), order, state, ctx);
        case 'Redeliver':
          if (!order) return this.greeting(state, ctx);
          return this.escalate('WrongOrder', [`I've asked ${order.restaurantName} and our team to send the correct order. Because you need your food now, it's High priority.`],
            copy(esc(Guidelines.wrong, order, `The whole order ${order.id} from ${order.restaurantName} was wrong. The customer asks for the correct order to be delivered.`), { severity: Severity.High }), state, ctx);
        case 'ItemRefund': return this.itemRefund(order, state, ctx);
        case 'TellRestaurant':
          if (!order) return this.greeting(state, ctx);
          if (a.type === 'MissingAction' && a.tamper) {
            return this.escalate('DriverIssue', [`Done. I've told ${order.restaurantName}, and reported the opened bag to our logistics team so they can follow it up with the driver.`],
              E(Category.DriverConduct, 'Possible Tampering', Severity.High, order.id, order.restaurantName,
                `Order ${order.id}: the customer says the bag was opened or food eaten before delivery. No refund requested.`), state, ctx);
          }
          return result(reply('FoodQuality', [`Done. I've passed your feedback to ${order.restaurantName} so they can put it right. Anything else I can help with?`], { quickReplies: [menu()], answered: true }),
            copy(state, { awaiting: W('Nothing') }));
        case 'CheckedEverywhere': return order ? this.notReceived(order, copy(state, { awaiting: W('Nothing') }), ctx) : this.greeting(state, ctx);
        case 'FoundIt': return this.done('NeverArrived', "Great, I'm glad you found it. Enjoy your meal!", state);
        case 'WasCharged':
          return this.escalate('PaymentProblem', [
            "Thanks for telling me. Being charged for food you never got is serious, so I've added it to your case as Critical. Our payments team will look at it immediately.",
            "Please don't share card numbers or PINs here; we will never ask for your PIN.",
          ], E(Category.PaymentIssue, 'Charged For Undelivered Order', Severity.Critical, order ? order.id : null, order ? order.restaurantName : null,
            `The customer was charged for order ${order ? order.id : ''} but never received it.`), copy(state, { lastProblem: 'PaymentProblem' }), ctx);
        case 'UseAddress': return order ? this.newAddress(order, action.address, copy(state, { awaiting: W('Nothing') }), ctx) : this.greeting(state, ctx);
        case 'KeepWaiting': return result(reply('Late', ["Thanks for your patience. I'll post an update here as soon as it moves."], { answered: true }), copy(state, { awaiting: W('Nothing') }));
        case 'ConfirmCancel': return order ? this.confirmCancel(order, copy(state, { awaiting: W('Nothing') }), ctx) : this.greeting(state, ctx);
        case 'KeepOrder': return result(reply('CancelOrder', ['No problem, your order stays as it is. Anything else I can help with?'], { quickReplies: order ? this.stageChips(order) : menuChips() }),
          copy(state, { awaiting: W('Nothing') }));
        case 'ChaseComplaint': {
          const c = maxBy(ctx.complaints.filter((x) => x.status.isOpen || (x.refund && x.refund.status === RefundStatus.Declined)), (x) => x.createdAt);
          return c ? this.chase(c, state, ctx) : this.complaintStatus(state, ctx);
        }
        case 'Helped': return this.done('Thanks', 'Glad I could help. Anything else?', state);
        case 'NotHelped': return result(reply('Correction', ["Sorry that didn't help. Would you like a person to take over, or try one of these?"], { quickReplies: [human()].concat(menuChips()) }),
          copy(state, { awaiting: W('Nothing') }));
        case 'Human': return this.handOff('', state, ctx);
        case 'Call': return this.callAgent(state);
        default: return this.greeting(state, ctx);
      }
    }

    itemRefund(order, state, ctx) {
      if (!order) return this.greeting(state, ctx);
      const a = state.awaiting;
      if (a.type === 'MissingAction') {
        const items = a.items;
        const amount = items.reduce((sum, it) => sum + unitOf(order.lines[it.index]) * it.qty, 0);
        const what = listJoin(items.map((it) => `${it.qty} × ${order.lines[it.index].name}`));
        let e = esc(Guidelines.missing, order, `${what} missing from order ${order.id} (${Fmt.money(amount)}). The customer asks for a refund.` +
          (a.tamper ? ' The customer says the bag was opened or food eaten before delivery (possible tampering).' : ''), { amount, reason: `Missing: ${what}` });
        if (a.tamper) e = copy(e, { subcategory: 'Missing Items (Possible Tampering)', severity: Severity.High });
        return this.refundFlow(e, order, state, ctx);
      }
      if (a.type === 'WrongAction') {
        const idx = a.indexes || [0];
        const amount = idx.reduce((sum, i) => sum + order.lines[i].total, 0);
        const what = listJoin(idx.map((i) => order.lines[i].name));
        return this.refundFlow(esc(Guidelines.wrong, order, `Wrong ${what} on order ${order.id} (${Fmt.money(amount)}). The customer asks for a refund.`,
          { amount, reason: `Wrong item: ${what}` }), order, state, ctx);
      }
      if (a.type === 'QualityAction') {
        const idx = a.indexes;
        const amount = idx.reduce((sum, i) => sum + order.lines[i].total, 0);
        const what = listJoin(idx.map((i) => order.lines[i].name));
        const sub = { Cold: 'Cold Food Delivered', Spilled: 'Damaged Or Spilled Food', Undercooked: 'Undercooked Food', TastesOff: 'Poor Taste Or Freshness' }[a.kind.name];
        return this.refundFlow(copy(esc(Guidelines.quality, order, `${a.kind.label}: ${what} on order ${order.id} (${Fmt.money(amount)}). The customer asks for a refund.`,
          { amount, reason: `${a.kind.label}: ${what}` }), { subcategory: sub }), order, state, ctx);
      }
      return this.greeting(state, ctx);
    }

    refundFlow(e, order, state, ctx, lead) {
      const amount = e.refund ? e.refund.amount : 0;
      const notes = this.timeNotes(order, ctx);
      const first = lead || [];
      if (order.pay === PayKind.Card) {
        return this.escalate(this.intentFor(e.category), first.concat([`I've asked for a refund of ${Fmt.money(amount)} back to your card. A support agent reviews every refund (I can't approve them myself). Once approved, it arrives ${RefundMethod.Card.timing}.`]).concat(notes),
          copy(e, { refundMethod: RefundMethod.Card }), state, ctx);
      }
      return result(reply(this.intentFor(e.category), first.concat([`You paid cash, so how would you like the ${Fmt.money(amount)} back?`]).concat(notes), {
        quickReplies: [qr(A('ChooseMethod', { method: RefundMethod.EatsCredit }), 'As eats credit'), qr(A('ChooseMethod', { method: RefundMethod.BankTransfer }), 'By bank transfer')],
      }), copy(state, { awaiting: W('RefundMethodChoice', { escalation: e }) }));
    }

    timeNotes(order, ctx) {
      const since = ctx.now - (order.deliveredAt != null ? order.deliveredAt : order.placedAt);
      if (since > Guidelines.REFUND_REQUEST_DAYS * DAY) return [`This order is more than ${Guidelines.REFUND_REQUEST_DAYS} days old, so a refund is at the agent's discretion.`];
      if (since > Guidelines.FOOD_ISSUE_REPORT_HOURS * HOUR) return [`It's been more than ${Guidelines.FOOD_ISSUE_REPORT_HOURS} hours since delivery, so the agent will check this one carefully.`];
      return [];
    }

    escalate(intent, texts, escalation, state, ctx, extraChips) {
      const earlier = ctx.complaints.filter((c) => c.category === escalation.category && ctx.now - c.createdAt <= 30 * DAY &&
        !(c.status.isOpen && c.orderId !== null && c.orderId === escalation.orderId)).length;
      const counts = escalation.category !== Category.CustomerService && escalation.category !== Category.OrderChange;
      const e = counts && earlier > 0 && escalation.severity !== Severity.Critical
        ? copy(escalation, {
          severity: raised(escalation.severity),
          description: escalation.description + ` Repeat issue: ${earlier} earlier ${escalation.category.label} complaint${earlier > 1 ? 's' : ''} in 30 days.`,
        })
        : escalation;
      const extra = e.severity !== escalation.severity ? ["Because this has happened to you before, I've given it a higher priority."] : [];
      return result(reply(intent, texts.concat(extra), { escalation: e, quickReplies: extraChips || [] }), copy(state, { awaiting: W('Nothing'), misses: 0 }));
    }

    // --- Helpers ---
    simple(intent, text, state, chips, answered) { return result(reply(intent, [text], { quickReplies: chips, answered: !!answered }), copy(state, { awaiting: W('Nothing') })); }
    orderFor(state, ctx) {
      if (state.orderId !== null) { const o = ctx.orders.find((x) => x.id === state.orderId); if (o) return o; }
      return ctx.orders[0] || null;
    }
    stageSummary(order) {
      if (order.state === OrderState.Delivered) return `Your order from ${order.restaurantName} was ${order.pickup ? 'collected' : 'delivered'} at ${Fmt.time(order.deliveredAt != null ? order.deliveredAt : order.placedAt)}. Was everything okay?`;
      if (order.state === OrderState.Cancelled) return `Your order from ${order.restaurantName} was cancelled. How can I help?`;
      return this.progressText(order) + ' How can I help?';
    }
    stageChips(order) {
      const P = (...i) => i.map(pick);
      if (order.pickup) {
        switch (order.state.name) {
          case 'Received': return P('WhereIsOrder', 'CancelOrder', 'ModifyOrder', 'Pickup');
          case 'Preparing': return P('WhereIsOrder', 'CancelOrder', 'Late', 'Pickup');
          case 'OnTheWay': return P('WhereIsOrder', 'Pickup', 'OrderDetails');
          case 'Delivered': return P('MissingItem', 'WrongOrder', 'FoodQuality', 'RefundStatus');
          default: return P('PaymentProblem', 'ComplaintStatus');
        }
      }
      switch (order.state.name) {
        case 'Received': return P('WhereIsOrder', 'CancelOrder', 'ChangeAddress', 'ModifyOrder');
        case 'Preparing': return P('WhereIsOrder', 'CancelOrder', 'ChangeAddress', 'Late');
        case 'OnTheWay': return P('WhereIsOrder', 'ContactDriver', 'Late', 'ChangeAddress');
        case 'Delivered': return P('MissingItem', 'WrongOrder', 'FoodQuality', 'NeverArrived', 'RefundStatus');
        default: return P('PaymentProblem', 'ComplaintStatus');
      }
    }
    itemChips(order) {
      const seen = new Set();
      return order.lines.map((l, i) => {
        const label = !seen.has(l.name) ? l.name : `${l.name} (${i + 1})`;
        seen.add(l.name);
        return qr(A('ChooseItem', { index: i }), label);
      });
    }
    orderLabel(o) { return `${o.restaurantName}, ${Fmt.date(o.placedAt)}` + (o.active ? ' (current)' : ''); }
    viewChip(c) { return qr(A('OpenComplaint', { complaintId: c.id }), `View ${reference(c)}`); }

    orderCard(order) {
      const rows = [['Status', order.pickup && order.state === OrderState.OnTheWay ? 'Ready for pick-up' : order.state.label]];
      if (order.state.inProgress && order.minutesLeft != null && !(order.pickup && order.state === OrderState.OnTheWay)) {
        rows.push([order.pickup ? 'Ready in' : 'Arriving in', 'about ' + Fmt.minutes(order.minutesLeft) + (order.minutesLate > 0 ? ' (late)' : '')]);
      }

      }
      rows.push(['Items', String(itemCount(order))]);

      if (c.status.isOpen) rows.push(['Response by', c.severity === Severity.Critical ? 'Immediately' : Fmt.due(c.dueAt, now)]);
      if (c.refund) rows.push(['Refund', `${Fmt.money(c.refund.amount)}, ${c.refund.status.label.toLowerCase()}`]);

        WrongOrder: Guidelines.wrong, FoodQuality: Guidelines.quality, FoodSafety: Guidelines.safety, RefundStatus: Guidelines.refundLate,
        PaymentProblem: Guidelines.payment, PoorSupport: Guidelines.poorSupport, CancelOrder: Guidelines.cancel, ChangeAddress: Guidelines.address,
        DriverIssue: Guidelines.driver,

      if (hasAny(t, S('spilled', 'spilt', 'leaked', 'leaking', 'damaged', 'squashed', 'crushed', 'melted', 'soggy', 'broken'))) return QualityKind.Spilled;
      if (hasAny(t, S('undercooked', 'raw')) || n.includes('not cooked') || n.includes('half cooked')) return QualityKind.Undercooked;
      if (hasAny(t, S('stale', 'tastes', 'tasted', 'smells', 'smelled', 'off', 'salty', 'bland', 'burnt', 'burned', 'overcooked', 'flat', 'hard', 'dry', 'old', 'oily', 'greasy'))) return QualityKind.TastesOff;

    chargeKind(text, order) {

      if (hasAny(t, S('twice', 'double', 'duplicate', 'doubled')) || n.includes('two times') || /\b(also|as well|both)\b/.test(n) && /\bcharg/.test(n) ||
        (/\bpaid cash\b/.test(n) && /\bcard\b/.test(n))) return ChargeKind.Twice;
      if (hasAny(t, S('unauthorised', 'unauthorized', 'fraud', 'fraudulent', 'recognise', 'recognize', 'strange', 'unknown', 'stolen'))) return ChargeKind.Unknown;

  }

  // Complaints store (SupportStore.kt)

  const ID_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  class SupportStore {
    constructor(initial, clock, random) {
      this.complaints = initial || [];
      this.clock = clock || Date.now;
      this.random = random || ((n) => Math.floor(Math.random() * n));
      this.listeners = [];
    }
    addListener(f) { this.listeners.push(f); }
    changed() { this.listeners.forEach((f) => f()); }
    replaceAll(list) { this.complaints = list; this.changed(); }
    complaint(id) { return this.complaints.find((c) => c.id === id) || null; }
    sorted() { return this.complaints.slice().sort((a, b) => b.createdAt - a.createdAt); }
    dueFor(sev, now) { return now + sev.responseHours * 3600000; }
    newId() {
      let id;
      do { id = ''; for (let i = 0; i < 6; i++) id += ID_CHARS[this.random(ID_CHARS.length)]; } while (this.complaints.some((c) => c.id === id));
      return id;
    }
    escalate(e, transcript) {
      const now = this.clock();
      const open = maxBy(this.complaints.filter((c) => c.status.isOpen && e.orderId !== null && c.orderId === e.orderId &&
        (c.category === e.category || e.category === Category.CustomerService || e.category === Category.PaymentIssue)), (c) => c.createdAt);
      const mkRefund = () => (e.refund ? { amount: e.refund.amount, method: e.refundMethod || RefundMethod.Card, status: RefundStatus.Requested, reason: e.refund.reason } : null);
      const settled = open && open.refund && e.refund && open.refund.status !== RefundStatus.Requested;
      if (open && !settled) {
        const refund = open.refund && e.refund
          ? copy(open.refund, { amount: open.refund.amount + e.refund.amount, reason: `${open.refund.reason}; ${e.refund.reason}` })
          : open.refund || mkRefund();
        const severity = e.severity.ordinal > open.severity.ordinal ? e.severity : open.severity;
        const updated = copy(open, {
          severity,
          dueAt: severity !== open.severity ? this.dueFor(severity, now) : open.dueAt,
          refund,
          events: open.events.concat([{ at: now, text: `Added from chat: ${e.description}` + (open.refund && e.refund ? ` Refund now ${Fmt.money(refund.amount)} in total.` : ''), by: 'bot', status: null }]),
          transcript: open.transcript.concat(transcript),
        });
        this.complaints = this.complaints.map((c) => (c.id === open.id ? updated : c));
        this.changed();
        return { complaint: updated, joined: true };
      }
      const events = [{ at: now, text: `Logged by the chatbot. Sent to ${e.category.department}.`, by: 'bot', status: ComplaintStatus.Open }];
      if (e.refund) events.push({ at: now, text: `Refund of ${Fmt.money(e.refund.amount)} requested ${(e.refundMethod || RefundMethod.Card).label}.`, by: 'bot', status: null });
      const complaint = {
        id: this.newId(), orderId: e.orderId, restaurantName: e.restaurantName, category: e.category, subcategory: e.subcategory, severity: e.severity,
        status: ComplaintStatus.Open, createdAt: now, dueAt: this.dueFor(e.severity, now), description: e.description, refund: mkRefund(),
        events, transcript, reopened: 0, escalated: false,
      };
      this.complaints = this.complaints.concat([complaint]);
      this.changed();
      return { complaint, joined: false };
    }
    update(id, f) {
      let touched = false;
      this.complaints = this.complaints.map((c) => { if (c.id === id) { touched = true; return f(c); } return c; });
      if (touched) this.changed();
    }
    chase(id) {
      this.update(id, (c) => {
        const now = this.clock();
        const severity = c.severity.ordinal < Severity.High.ordinal ? Severity.High : c.severity;
        const reopened = c.refund && c.refund.status === RefundStatus.Declined && !c.status.isOpen;
        return copy(c, {
          severity, escalated: true,
          status: reopened ? ComplaintStatus.Open : c.status,
          refund: reopened ? copy(c.refund, { status: RefundStatus.Requested }) : c.refund,
          dueAt: this.dueFor(severity, now),
          events: c.events.concat([{ at: now, text: "Raised to a supervisor at the customer's request.", by: 'bot', status: reopened ? ComplaintStatus.Open : null }]),
        });
      });
    }
    advance(id) {
      this.update(id, (c) => {
        const now = this.clock();
        if (c.status === ComplaintStatus.Open) {
          return copy(c, {
            status: ComplaintStatus.Pending,
            refund: c.refund && c.refund.status === RefundStatus.Requested ? copy(c.refund, { status: RefundStatus.Approved }) : c.refund,
            events: c.events.concat([{ at: now, text: 'An agent is working on it.' + (c.refund ? ` Refund of ${Fmt.money(c.refund.amount)} approved.` : ''), by: 'agent', status: ComplaintStatus.Pending }]),
          });
        }
        if (c.status === ComplaintStatus.Pending) {
          return copy(c, {
            status: ComplaintStatus.Resolved,
            refund: c.refund && (c.refund.status === RefundStatus.Approved || c.refund.status === RefundStatus.Requested) ? copy(c.refund, { status: RefundStatus.Paid }) : c.refund,
            events: c.events.concat([{ at: now, text: 'Resolved by an agent.' + (c.refund ? ` Refund of ${Fmt.money(c.refund.amount)} paid ${c.refund.method.label}.` : ''), by: 'agent', status: ComplaintStatus.Resolved }]),
          });
        }
        return c;
      });
    }
    declineRefund(id) {
      this.update(id, (c) => {
        if (!c.refund || !c.status.isOpen) return c;
        return copy(c, {
          status: ComplaintStatus.Resolved, refund: copy(c.refund, { status: RefundStatus.Declined }),
          events: c.events.concat([{ at: this.clock(), text: 'Refund declined by an agent.', by: 'agent', status: ComplaintStatus.Resolved }]),
        });
      });
    }
    close(id) { this.update(id, (c) => copy(c, { status: ComplaintStatus.Closed, events: c.events.concat([{ at: this.clock(), text: "Closed: the customer confirmed it's sorted.", by: 'you', status: ComplaintStatus.Closed }]) })); }
    reopen(id) {
      this.update(id, (c) => {
        const now = this.clock(); const severity = raised(c.severity);
        return copy(c, {
          status: ComplaintStatus.Open, severity, dueAt: this.dueFor(severity, now), reopened: c.reopened + 1,
          events: c.events.concat([{ at: now, text: `Reopened by the customer. Priority raised to ${severity.label}.`, by: 'you', status: ComplaintStatus.Open }]),
        });
      });
    }
    withdraw(id) { this.update(id, (c) => copy(c, { status: ComplaintStatus.Unresolved, events: c.events.concat([{ at: this.clock(), text: 'Withdrawn by the customer.', by: 'you', status: ComplaintStatus.Unresolved }]) })); }
    /** A short case summary written by the AI helper for the human agent (shown in the timeline). */
    addBrief(id, text) {
      const clean = text.trim().slice(0, 400);
      if (clean === '') return;
      this.update(id, (c) => copy(c, { events: c.events.concat([{ at: this.clock(), text: `Summary for the agent: ${clean}`, by: 'assistant', status: null }]) }));
    }
    addNote(id, text) {
      const clean = text.trim().slice(0, 500);
      if (clean === '') return;
      this.update(id, (c) => {
        const now = this.clock();
        return copy(c, { events: c.events.concat([{ at: now, text: `You added: ${clean}`, by: 'you', status: null }]), transcript: c.transcript.concat([{ fromCustomer: true, text: clean, at: now }]) });
      });
    }
  }

    conflictsWithCart(rid) { return this.s.cartRestaurantId !== null && this.s.cartRestaurantId !== rid && this.s.lines.length > 0; },
    clearCart() { this.update({ cartRestaurantId: null, lines: [], promoApplied: false }); },
    addToCart(rid, dish, qty, selections, note, unit) {
      const s = this.s;
      const base = s.cartRestaurantId === rid ? s.lines : [];
      const i = base.findIndex((l) => l.dish.id === dish.id && sameSel(l.selections, selections) && l.note === note);
      const lines = i >= 0 ? base.map((l, k) => (k === i ? Object.assign({}, l, { qty: l.qty + qty }) : l)) : base.concat([{ dish, qty, selections, note, unit }]);

    },
    changeQty(index, delta) {
      const lines = this.s.lines.flatMap((l, i) => (i !== index ? [l] : l.qty + delta > 0 ? [Object.assign({}, l, { qty: l.qty + delta })] : []));
      if (lines.length === 0) this.update({ lines: [], cartRestaurantId: null, promoApplied: false }); else this.update({ lines });
    },
    applyPromo(code) { const ok = code.trim().toUpperCase() === Core.PROMO.code; if (ok) this.update({ promoApplied: true }); return ok; },
    placeOrder(address, instructions) {
      const s = this.s; const r = this.cartRestaurant();
      if (!r || s.lines.length === 0) return;
      const pickup = s.mode === 'Pickup';
      const o = {
        id: 'E-' + (1000 + Math.floor(Math.random() * 9000)), restaurantId: r.id, lines: s.lines, total: this.totals().total, pickup, etaMinutes: r.etaMinutes,
        address: pickup ? '' : address.trim(), instructions: instructions.trim(), pay: s.pay, placedAt: Date.now(), seconds: 0, step: 0, rating: 0,
        cancelled: false, lateMinutes: 0, deliveredAt: null, autoAdvance: true,
      };

    },
    startTicking() {
      clearInterval(this.timer);
      this.timer = setInterval(() => {
        const o = this.s.activeOrder;
        if (!o || order.finished(o) || !o.autoAdvance) { clearInterval(this.timer); return; }
        this.setSeconds(o.seconds + 1);
      }, 1000);
    },
    stepFor(o, sec) { let idx = 0; STEP_SHARE.forEach((_, i) => { if (sec >= stepAt(o, i)) idx = i; }); return idx; },
    setSeconds(sec) {
      const s = this.s; const o = s.activeOrder; if (!o) return;
      const step = this.stepFor(o, sec);
      const u = Object.assign({}, o, { seconds: sec, step, deliveredAt: step === 3 ? (o.deliveredAt || Date.now()) : null });
      const just = order.delivered(u) && !s.history.some((h) => h.id === u.id);
      this.update({ activeOrder: u, history: just ? [this.toPast(u)].concat(s.history) : s.history });
      if (just) this.persist();
    },
    toPast(o) {
      const r = Core.restaurant(o.restaurantId);
      return { id: o.id, restaurantId: o.restaurantId, restaurantName: r ? r.name : '', placedAt: o.placedAt, total: o.total, pickup: o.pickup,
        lines: o.lines.map((l) => ({ name: l.dish.name, qty: l.qty, total: lineTotal(l) })), rating: o.rating, deliveredAt: o.deliveredAt || Date.now(), pay: o.pay, address: o.address };
    },
    skipAhead() { const o = this.s.activeOrder; if (!o || order.finished(o)) return; this.setSeconds(stepAt(o, o.step + 1)); },
    rateOrder(stars) {
      const id = this.s.activeOrder ? this.s.activeOrder.id : null;
      this.update({ activeOrder: this.s.activeOrder && Object.assign({}, this.s.activeOrder, { rating: stars }), history: this.s.history.map((h) => (h.id === id ? Object.assign({}, h, { rating: stars }) : h)) });
      this.persist();
    },
    finishOrder() { clearInterval(this.timer); this.update({ activeOrder: null }); },
    cancelActive() { clearInterval(this.timer); const o = this.s.activeOrder; if (o) this.update({ activeOrder: Object.assign({}, o, { cancelled: true, autoAdvance: false }) }); },
    changeActiveAddress(a) { const o = this.s.activeOrder; if (o) this.update({ activeOrder: Object.assign({}, o, { address: a.trim() }) }); },
    demoSetStep(step) {
      clearInterval(this.timer);
      const o = this.s.activeOrder; if (!o) return;
      this.s = Object.assign({}, this.s, { activeOrder: Object.assign({}, o, { cancelled: false, autoAdvance: false }) });

    },
    demoSetLate(m) { const o = this.s.activeOrder; if (o) this.update({ activeOrder: Object.assign({}, o, { lateMinutes: m }) }); },
    demoResume() { const o = this.s.activeOrder; if (!o) return; this.update({ activeOrder: Object.assign({}, o, { autoAdvance: true, cancelled: false }) }); this.startTicking(); },

        const r = Core.restaurant(a.restaurantId);
        const state = a.cancelled ? B.OrderState.Cancelled : [B.OrderState.Received, B.OrderState.Preparing, B.OrderState.OnTheWay, B.OrderState.Delivered][a.step];
        const hasDriver = !a.pickup && (state === B.OrderState.OnTheWay || state === B.OrderState.Delivered);
        out.push({
          id: a.id, restaurantName: r ? r.name : '', restaurantArea: r ? r.area : '', lines: a.lines.map((l) => ({ name: l.dish.name, qty: l.qty, total: lineTotal(l) })),
          total: a.total, deliveryFee: r ? r.deliveryFee : 0, freeDeliveryOver: r ? r.freeDeliveryOver : 0, pickup: a.pickup, address: a.address,
          pay: a.pay === 'Card' ? B.PayKind.Card : B.PayKind.Cash, state, minutesLeft: state.inProgress ? order.minutesLeft(a) : null,
          minutesLate: state.inProgress ? a.lateMinutes : 0, placedAt: a.placedAt, deliveredAt: state === B.OrderState.Delivered ? (a.deliveredAt || a.placedAt) : null,
          driverName: hasDriver ? Core.DRIVER.name : null, driverVehicle: hasDriver ? Core.DRIVER.vehicle : null, rating: a.rating, active: true,
        });
      }
      s.history.filter((h) => !a || h.id !== a.id).forEach((h) => {
        const r = Core.restaurant(h.restaurantId);
        out.push({
          id: h.id, restaurantName: h.restaurantName, restaurantArea: r ? r.area : '', lines: h.lines.map((l) => ({ name: l.name, qty: l.qty, total: l.total })),
          total: h.total, deliveryFee: r ? r.deliveryFee : 0, freeDeliveryOver: r ? r.freeDeliveryOver : 0, pickup: h.pickup, address: h.address || '',
          pay: h.pay === 'Card' ? B.PayKind.Card : B.PayKind.Cash, state: B.OrderState.Delivered, minutesLeft: null, minutesLate: 0, placedAt: h.placedAt,
          deliveredAt: h.deliveredAt > 0 ? h.deliveredAt : h.placedAt, driverName: h.pickup ? null : Core.DRIVER.name, driverVehicle: h.pickup ? null : Core.DRIVER.vehicle,
          rating: h.rating, active: false,
        });
      });
      return out;
    },
  });
  Orders.s = Orders.fresh();
  Core.lineTotal = lineTotal;
})();</script>
<script>/* eats browser build: the support chatbot wired to the orders, saved in this browser (SupportViewModel.kt). */
(function () {
  'use strict';
  const B = window.EatsBot;
  const Core = window.EatsCore;
  const Support = (window.EatsSupport = {});

  // --- Saving complaints, learning and AI settings (SupportPersistence.kt) ---
  const pick = (map, name, fallback) => (name && map[name]) || fallback;
  const toJson = (c) => ({
    id: c.id, orderId: c.orderId, restaurantName: c.restaurantName, category: c.category.name, subcategory: c.subcategory, severity: c.severity.name,
    status: c.status.name, createdAt: c.createdAt, dueAt: c.dueAt, description: c.description, reopened: c.reopened, escalated: c.escalated,
    refund: c.refund ? { amount: c.refund.amount, method: c.refund.method.name, status: c.refund.status.name, reason: c.refund.reason } : null,
    events: c.events.map((e) => ({ at: e.at, text: e.text, by: e.by, status: e.status ? e.status.name : null })),
    transcript: c.transcript,
  });
  const fromJson = (o) => ({
    id: o.id, orderId: o.orderId || null, restaurantName: o.restaurantName || null, category: pick(B.Category, o.category, B.Category.CustomerService),
    subcategory: o.subcategory, severity: pick(B.Severity, o.severity, B.Severity.Medium), status: pick(B.ComplaintStatus, o.status, B.ComplaintStatus.Open),
    createdAt: o.createdAt, dueAt: o.dueAt, description: o.description || '', reopened: o.reopened || 0, escalated: !!o.escalated,
    refund: o.refund ? { amount: o.refund.amount, method: pick(B.RefundMethod, o.refund.method, B.RefundMethod.Card), status: pick(B.RefundStatus, o.refund.status, B.RefundStatus.Requested), reason: o.refund.reason || '' } : null,
    events: (o.events || []).map((e) => ({ at: e.at, text: e.text, by: e.by, status: e.status ? pick(B.ComplaintStatus, e.status, null) : null })),
    transcript: o.transcript || [],
  });

  const savedMemory = Core.store.get('eats_learned', { mistakes: 0, entries: [] });
  const memory = new B.LearningMemory(savedMemory.entries || []);
  memory.mistakes = savedMemory.mistakes || 0;
  const store = new B.SupportStore([]);
  let userId = null;
  let firstName = 'there';
  // Built-in Groq key for the presentation build. Anyone with this file can read it, so it should be
  // revoked (console.groq.com/keys) once the presentations are over.
  const BUILT_IN_KEY = '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';
  const defaults = { apiKey: BUILT_IN_KEY, baseUrl: B.AiSettings.DEFAULT_BASE_URL, model: B.AiSettings.DEFAULT_MODEL, enabled: true };
  const saved = Core.store.get('eats_ai', {});
  let ai = Object.assign({}, defaults, saved);
  if (!ai.apiKey || !ai.apiKey.trim()) ai.apiKey = BUILT_IN_KEY; // an older empty setting never hides the built-in key
  const usable = () => ai.enabled && ai.apiKey.trim() !== '';
  const listeners = [];
  const changed = () => listeners.forEach((f) => f());

  const saveLearning = () => Core.store.set('eats_learned', { mistakes: memory.mistakes, entries: memory.all });

  const chat = new B.SupportChat(store, memory, {
    onOrderAction: (a) => (a.type === 'Cancel' ? Core.Orders.cancelActive() : Core.Orders.changeActiveAddress(a.address)),
    onEvent: (e) => Support.onEvent && Support.onEvent(e),
    onLearned: saveLearning,
    // The AI reads every typed message while it is working; after a failure the bot answers on its own
    // and tries the AI again a minute later.
    aiFirst: () => usable() && (aiProblem === null || Date.now() - aiProblemAt > 60000),
  });
  chat.context = () => ({ firstName, orders: Core.Orders.botOrders(), complaints: store.sorted(), now: Date.now(), aiAvailable: usable() });
  chat.addListener(changed);
  store.addListener(() => { if (userId) Core.store.set('eats_complaints:' + userId, store.complaints.map(toJson)); changed(); });
  Core.Orders.listeners.push(() => chat.onOrdersChanged());

  // Tell the customer once (not on every message) when the AI can't be reached; the bot keeps working.
  let aiProblem = null; let aiProblemAt = 0;
  function reportAiProblem(e) {
    const why = e && e.message ? e.message : 'network error';
    aiProblemAt = Date.now();
    if (aiProblem === why) return;
    aiProblem = why;
    // Not shown to customers: the bot simply answers on its own. Visible in the browser console and
    // under menu > AI helper settings > Test connection.
    if (typeof console !== 'undefined') console.warn('eats AI helper unavailable: ' + why);
  }
  async function briefAgent(id) {
    if (!usable()) return;
    const c = store.complaint(id); if (!c) return;
    try {
      const body = B.AiPrompt.requestBody(ai, B.AiPrompt.briefSystem(), B.AiPrompt.briefUser(c));
      const summary = B.AiPrompt.parseBrief(B.AiPrompt.content(await B.callAi(ai, body)));
      if (summary) store.addBrief(id, summary);
    } catch (_) { /* the complaint is already logged; the summary is a bonus */ }
  }

  Object.assign(Support, {
    chat, store, memory, listeners,
    get ai() { return ai; },
    aiUsable: usable,
    bindUser(user) {
      if ((user ? user.id : null) === userId) return;
      userId = user ? user.id : null;
      firstName = user && user.firstName.trim() ? user.firstName : 'there';
      store.replaceAll(user ? Core.store.get('eats_complaints:' + user.id, []).map(fromJson) : []);
      chat.reset();
    },
    open: () => chat.open(),
    async send(text) {
      const before = new Set(store.complaints.map((c) => c.id));
      chat.send(text);
      const pending = chat.pendingAi;
      if (pending !== null) {
        let result = null;
        try {
          const body = B.AiPrompt.requestBody(ai, B.AiPrompt.system(chat.context()), B.AiPrompt.user(pending, chat.recentTranscript()));
          result = B.AiPrompt.parse(B.AiPrompt.content(await B.callAi(ai, body)));
          aiProblem = null;
        } catch (e) { result = null; reportAiProblem(e); }
        chat.onAiResult(result);
      }
      // A complaint the bot just logged gets a short AI summary in its timeline for the agent.
      store.complaints.filter((c) => !before.has(c.id)).forEach((c) => briefAgent(c.id));
    },
    callEnded(agent, seconds) {
      chat.note(seconds <= 0 ? 'Call to eats support cancelled.' : `Call with ${agent} ended (${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}).`);
    },
    forget(phrase) { memory.forget(phrase); saveLearning(); changed(); },
    forgetAll() { memory.clear(); saveLearning(); changed(); },
    saveAi(s) { ai = Object.assign({}, s, { apiKey: s.apiKey.trim() || BUILT_IN_KEY }); aiProblem = null; Core.store.set('eats_ai', ai); changed(); },
    async testAi(s) {
      if (s.apiKey.trim() === '') return 'Add your API key first.';
      try {
        const body = B.AiPrompt.requestBody(s, 'Reply ONLY with this JSON: {"intent":"none","answer":"Connected"}', 'Test');
        const reply = B.AiPrompt.content(await B.callAi(s, body));
        return reply ? `Connected to ${s.model}. The AI helper is ready.` : 'Connected, but the model sent an empty reply. Try another model.';
      } catch (e) {
        return "Couldn't connect: " + (e && e.message ? e.message : 'network error (check the key, or your browser may block the request)');
      }
    },
  });
})();</script>
<script>/* eats browser build: the screens (ports of ui/screens/*.kt) and navigation (ui/EatsApp.kt). */
(function () {
  'use strict';
  const Core = window.EatsCore;
  const B = window.EatsBot;
  const Support = window.EatsSupport;
  const Orders = Core.Orders;
  const { esc, money, icon, plate } = Core;
  const $ = (sel, root) => (root || document).querySelector(sel);

  // ===========================================================================================
  // App state and navigation
  // ===========================================================================================
  const app = {
    user: null,
    stack: [{ route: 'splash', s: {} }],
    dialog: null, // { title, body, buttons:[{label, act, data}] , kind }
    sheet: null, // { dishId, restaurantId, qty, sel, note }
    snack: null, // { text, action, act }
    loading: false,
    error: null,
  };
  const top = () => app.stack[app.stack.length - 1];
  const SIGNED_IN = new Set(['main', 'restaurant', 'cart', 'checkout', 'confirmation', 'track', 'favourites', 'chat', 'call', 'complaints', 'complaint']);

  function navigate(route, args, opt) {
    opt = opt || {};
    if (opt.clear) app.stack = [];
    if (opt.popUpTo) {
      const i = app.stack.map((e) => e.route).lastIndexOf(opt.popUpTo);
      if (i >= 0) app.stack = app.stack.slice(0, opt.inclusive ? i : i + 1);
    }
    if (opt.singleTop && top() && top().route === route && JSON.stringify(top().args || {}) === JSON.stringify(args || {})) { render(); return; }
    app.stack.push({ route, args: args || {}, s: {} });
    app.error = null; app.snack = null;
    onEnter(top());
    render(true);
  }
  function popTo(route) {
    const i = app.stack.map((e) => e.route).lastIndexOf(route);
    if (i >= 0) app.stack = app.stack.slice(0, i + 1);
    render(true);
  }
  function back() {
    if (app.sheet) { app.sheet = null; render(); return; }
    if (app.dialog) { app.dialog = null; render(); return; }
    const e = top();
    if (e.route === 'main' && e.s.tab && e.s.tab !== 'home') { e.s.tab = 'home'; render(true); return; }
    if (e.route === 'confirmation') { popTo('main'); return; }
    if (e.route === 'forgot' && e.s.step === 2) { e.s.step = 1; e.s.submitted = false; app.error = null; render(); return; }
    if (e.route === 'call') { endCall(); return; }
    if (app.stack.length > 1) { app.stack.pop(); app.error = null; render(true); }
  }
  function onEnter(e) {
    if (e.route === 'chat') Support.open();
    if (e.route === 'splash') setTimeout(() => navigate(app.user ? 'main' : 'login', null, { clear: true }), 1900);
    if (e.route === 'call') startCall(e);
  }
  function signedIn(user) {
    app.user = user;
    Orders.bind(user);
    Support.bindUser(user);
  }
  function signOut() {
    Core.Auth.logout();
    signedIn(null);
    app.dialog = null;
    navigate('login', null, { clear: true });
  }

    if (e.type === 'StartCall') navigate('call', null, { singleTop: true });

  let snackTimer = null;
  function snack(text, action) {

  }

  const panel = (inner, cls) => `<div class="panel ${cls || ''}">${inner}</div>`;

  };

  const emptyState = (art, title, msg, actionLabel, act) => `<div class="empty">${plate(art, { steam: true, style: 'width:112px' })}

  function field(o) {

  const modeToggle = (mode) => `<div class="mode">${['Delivery', 'Pickup'].map((m) => `<button class="${m === mode ? 'on' : ''}" data-act="mode" data-v="${m}">${m === 'Delivery' ? 'Delivery' : 'Pick-up'}</button>`).join('')}</div>`;
