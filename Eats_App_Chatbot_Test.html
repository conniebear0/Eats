<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>eats app with support chatbot (browser test build)</title>

<style>
/* Colours from ui/theme/Color.kt, Theme.kt and Semantic.kt */
:root, :root[data-resolved="light"] {
  --primary: #EA580C; --on-primary: #FFFFFF; --primary-container: #FFEDD5; --on-primary-container: #7C2D12;
  --tertiary: #C2410C; --bg: #FFFFFF; --on-bg: #111111; --surface: #FFFFFF;
  --surface-variant: #F5F5F4; --on-surface-variant: #57534E; --outline: #9A948E; --outline-variant: #E7E5E4;
  --error: #B91C1C; --plate-face: #FB923C; --star: #F59E0B; --heart: #E11D48; --success: #15803D;
  --inverse: #322F35; --on-inverse: #F5EFF7;
  --page: #EDEBE9; --page-ink: #57534E; --frame: #1b1b1b;
  color-scheme: light;
}
:root[data-resolved="dark"] {
  --primary: #7C3AED; --on-primary: #FFFFFF; --primary-container: #2E1065; --on-primary-container: #EDE9FE;
  --tertiary: #A78BFA; --bg: #0A0A0A; --on-bg: #F5F5F5; --surface: #0A0A0A;
  --surface-variant: #1A1A1A; --on-surface-variant: #A3A3A3; --outline: #666666; --outline-variant: #262626;
  --error: #FCA5A5; --plate-face: #A78BFA; --star: #F59E0B; --heart: #E11D48; --success: #4ADE80;
  --inverse: #E6E0E9; --on-inverse: #322F35;
  --page: #161616; --page-ink: #A3A3A3; --frame: #000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--page-ink); font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: center; }
button:disabled { cursor: default; opacity: .38; }
img { display: block; }
hr.div { border: 0; border-top: 1px solid var(--outline-variant); margin: 0; width: 100%; }
.ic { fill: currentColor; flex: none; display: block; }

/* ---- Outside the phone ---- */
.dev { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 13px; max-width: 760px; text-align: center; }
.dev b { font-weight: 600; }
.dev code { background: color-mix(in srgb, var(--page-ink) 12%, transparent); padding: 2px 6px; border-radius: 6px; }
.dev button { border: 1px solid var(--outline); border-radius: 999px; padding: 5px 12px; font-size: 13px; }

/* ---- The phone ---- */
.phone { width: 400px; height: min(860px, calc(100vh - 80px)); min-height: 640px; border-radius: 40px; border: 10px solid var(--frame);
  background: var(--bg); color: var(--on-bg); overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.statusbar { height: 28px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 500; }
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.statusbar .sys i { display: inline-block; width: 14px; height: 9px; border: 1.5px solid currentColor; border-radius: 2px; position: relative; }
.statusbar .sys i::after { content: ""; position: absolute; inset: 1px 3px 1px 1px; background: currentColor; }
#screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.sysbar { height: 34px; flex: none; display: flex; align-items: center; justify-content: center; }
#sysback { width: 64px; height: 28px; display: grid; place-items: center; color: var(--on-surface-variant); border-radius: 14px; }
#sysback:hover { background: color-mix(in srgb, var(--on-bg) 8%, transparent); }
#sysback svg { width: 16px; height: 16px; fill: currentColor; }
@media (max-width: 520px) {
  body { padding: 0; gap: 0; justify-content: flex-start; }
  .dev { padding: 8px 12px; }
  .phone { width: 100%; height: auto; flex: 1; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
}

/* ---- Typography (Type.kt) ---- */
.headline { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.3px; margin: 0; }
.headline-s { font-size: 24px; line-height: 30px; font-weight: 700; margin: 0; }
.title-l { font-size: 20px; line-height: 26px; font-weight: 700; }
.title-m { font-size: 18px; line-height: 24px; font-weight: 600; }
.body-l { font-size: 16px; line-height: 24px; margin: 0; }
.body-m { font-size: 14px; line-height: 20px; margin: 0; }
.body-s { font-size: 13px; line-height: 18px; margin: 0; }
.label-l { font-size: 16px; line-height: 20px; font-weight: 600; }
.label-m { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .4px; }
.muted { color: var(--on-surface-variant); }
.tertiary { color: var(--tertiary); }
.error { color: var(--error); }
.success { color: var(--success); }
.link { color: var(--tertiary); font-weight: 600; }
.b { font-weight: 700; } .sb { font-weight: 600; } .ls { letter-spacing: 1.2px; }
.tc { text-align: center; } .tr { text-align: right; } .blk { display: block; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---- Layout utilities ---- */
.row { display: flex; align-items: center; min-width: 0; }
.row.top { align-items: flex-start; } .row.bottom { align-items: flex-end; } .row.center-v { align-items: center; }
.row.center { justify-content: center; } .row.end { justify-content: flex-end; } .row.between { justify-content: space-between; } .row.around { justify-content: space-around; }
.col { display: flex; flex-direction: column; min-width: 0; }
.col.end { align-items: flex-end; } .col.center-x { align-items: center; }
.grow { flex: 1; min-width: 0; } .grow0 { flex: 0 1 auto; min-width: 0; } .f1 { flex: 1; } .f2 { flex: 2; }
.fill { flex: 1; min-height: 0; } .w100 { width: 100%; }
.centered { display: flex; align-items: center; justify-content: center; }
.fill.col.center-x { align-items: center; }
.scroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
.hrow { display: flex; overflow-x: auto; scrollbar-width: none; flex: none; }
.hrow::-webkit-scrollbar { display: none; }
.hrow > * { flex: none; }
.gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap12 { gap: 12px; } .gap14 { gap: 14px; }
.mt2{margin-top:2px}.mt3{margin-top:3px}.mt4{margin-top:4px}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt14{margin-top:14px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt22{margin-top:22px}.mt24{margin-top:24px}.mt28{margin-top:28px}.mt32{margin-top:32px}.mt36{margin-top:36px}
.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}.mb20{margin-bottom:20px}.mb22{margin-bottom:22px}.ml4{margin-left:4px}.ml10{margin-left:10px}.ml12{margin-left:12px}.ml16{margin-left:16px}
.my8{margin:8px 0}.my10{margin:10px 0}
.p8{padding:8px}.p24{padding:24px}.p40{padding:40px}
.px10{padding-left:10px;padding-right:10px}.px12{padding-left:12px;padding-right:12px}.px20{padding-left:20px;padding-right:20px}.px24{padding-left:24px;padding-right:24px}
.py3{padding-top:3px;padding-bottom:3px}.py4{padding-top:4px;padding-bottom:4px}.py6{padding-top:6px;padding-bottom:6px}.py10{padding-top:10px;padding-bottom:10px}.py12{padding-top:12px;padding-bottom:12px}.py14{padding-top:14px;padding-bottom:14px}.py16{padding-top:16px;padding-bottom:16px}
.pt4{padding-top:4px}.pt6{padding-top:6px}.pt8{padding-top:8px}.pt10{padding-top:10px}.pt12{padding-top:12px}.pt14{padding-top:14px}.pt16{padding-top:16px}.pt20{padding-top:20px}.pt22{padding-top:22px}
.pb4{padding-bottom:4px}.pb6{padding-bottom:6px}.pb8{padding-bottom:8px}.pb16{padding-bottom:16px}.pb20{padding-bottom:20px}.pb22{padding-bottom:22px}.pb24{padding-bottom:24px}
.pl12{padding-left:12px}.pl20{padding-left:20px}.pr12{padding-right:12px}.pr14{padding-right:14px}

/* ---- Buttons ---- */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 14px; font-weight: 600; font-size: 16px; width: 100%; }
.btn.big { min-height: 56px; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.outlined { border: 1.5px solid var(--outline-variant); color: var(--on-bg); }
.btn.sq { width: auto; min-height: 56px; }
.btn.pillbtn { width: auto; border-radius: 999px; }
.btn:not(:disabled):hover { filter: brightness(1.06); }
.btn.outlined:hover { background: color-mix(in srgb, var(--on-bg) 5%, transparent); }
.text-btn { color: var(--tertiary); font-weight: 600; font-size: 14px; padding: 10px 12px; border-radius: 20px; }
.text-btn:hover { background: color-mix(in srgb, var(--tertiary) 9%, transparent); }
.text-btn.link { padding: 10px 6px; }
.text-btn.inv { color: var(--on-inverse); filter: brightness(1.2); }
.text-btn.error-c { color: var(--error); align-self: center; }
.icon-btn { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; flex: none; }
.icon-btn:hover { background: color-mix(in srgb, var(--on-bg) 7%, transparent); }
.icon-btn.shift { margin-left: -12px; }
.icon-btn.send { color: var(--primary); }
.circle-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--on-bg); flex: none; font-size: 20px; font-weight: 600; line-height: 1; }
.circle-btn.tonal { background: var(--surface-variant); }
.circle-btn.shadow { box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.circle-btn.sm { width: 34px; height: 34px; }
.stepper .circle-btn { background: var(--surface-variant); }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- Header, pills, panels ---- */
.hdr { display: flex; align-items: center; padding: 10px 16px 10px 20px; min-height: 68px; flex: none; }
.hdr h1 { font-size: 24px; line-height: 30px; font-weight: 700; margin: 0; flex: 1; min-width: 0; }
.hdr .ml12 { margin-left: 12px; }
.pill { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 7px; font-size: 12px; font-weight: 600; background: var(--primary); color: var(--on-primary); white-space: nowrap; }
.pill.pos { background: var(--surface-variant); color: var(--on-bg); }
.panel { border: 1.5px solid var(--outline-variant); border-radius: 20px; padding: 16px; display: block; width: 100%; }
.panel.clickable { display: flex; flex-direction: column; text-align: left; }
.panel.clickable:hover { background: color-mix(in srgb, var(--on-bg) 3%, transparent); }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; }
.empty-results { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 30px 20px; }
.note-box { background: var(--primary-container); color: var(--on-primary-container); border-radius: 14px; padding: 14px; font-size: 14px; line-height: 20px; }
.or { display: flex; align-items: center; gap: 12px; } .or span { flex: 1; height: 1px; background: var(--outline-variant); } .or em { font-style: normal; font-size: 14px; color: var(--on-surface-variant); }

/* ---- Text fields (OutlinedTextField) ---- */
.tf { display: flex; flex-direction: column; min-width: 0; }
.tf-box { position: relative; display: flex; align-items: center; border: 1px solid var(--outline); border-radius: 14px; min-height: 56px; padding: 0 4px 0 16px; background: transparent; }
.tf-box:focus-within { border: 2px solid var(--primary); padding-left: 15px; }
.tf-box input, .tf-box textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--on-bg); font: inherit; font-size: 16px; padding: 16px 12px 16px 0; resize: none; }
.tf-box.multi { align-items: flex-start; }
.tf-box textarea { line-height: 22px; }
.tf-box label { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); padding: 0 4px; font-size: 16px; color: var(--on-surface-variant); pointer-events: none; background: var(--bg); transition: all .12s; }
.tf.filled label, .tf-box:focus-within label { top: 0; font-size: 12px; }
.tf-box:focus-within label { color: var(--primary); }
.tf input::placeholder, .tf textarea::placeholder { color: var(--on-surface-variant); opacity: .8; }
.tf:not(.filled) .tf-box:has(label) input::placeholder { opacity: 0; }
.tf:not(.filled) .tf-box:has(label):focus-within input::placeholder { opacity: .8; }
.tf-prefix { font-size: 16px; color: var(--on-surface-variant); margin-right: 2px; }
.tf.filled .tf-prefix, .tf-box:focus-within .tf-prefix { color: var(--on-bg); }
.tf:not(.filled) .tf-box:not(:focus-within) .tf-prefix { visibility: hidden; }
.tf-support { font-size: 12px; line-height: 16px; color: var(--on-surface-variant); padding: 4px 16px 0; }
.tf.err .tf-box { border-color: var(--error); } .tf.err label, .tf.err .tf-support { color: var(--error) !important; }
.search-tf .tf-box { background: var(--surface-variant); border-color: transparent; }
.chat-box { min-height: 52px; border-radius: 14px; }
.chat-box textarea { padding: 14px 8px 14px 0; max-height: 104px; }
.checkbox { width: 48px; height: 48px; display: grid; place-items: center; margin-left: -12px; flex: none; }
.checkbox span { width: 20px; height: 20px; border: 2px solid var(--on-surface-variant); border-radius: 3px; display: grid; place-items: center; }
.checkbox.on span { background: var(--primary); border-color: var(--primary); }
.checkbox.on span::after { content: ""; width: 5px; height: 10px; border: solid var(--on-primary); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--on-surface-variant); display: inline-grid; place-items: center; flex: none; }
.radio.on { border-color: var(--primary); } .radio.on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.radio-wrap { width: 48px; height: 48px; display: grid; place-items: center; margin-left: -12px; flex: none; }
.opt-row .checkbox { margin-left: -12px; }
.switch { width: 52px; height: 32px; border-radius: 16px; border: 2px solid var(--outline); background: var(--surface-variant); position: relative; flex: none; }
.switch span { position: absolute; top: 6px; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline); transition: all .15s; }
.switch.on { background: var(--primary); border-color: var(--primary); } .switch.on span { left: 24px; top: 2px; width: 24px; height: 24px; background: var(--on-primary); }

/* ---- Auth ---- */
.pad-auth { padding: 28px 24px 24px; flex: 1; }
.wordmark { height: 46px; }
.splash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
.splash-logo { width: 190px; animation: pop .7s cubic-bezier(.3,1.5,.6,1) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.linear { width: 120px; height: 4px; border-radius: 2px; background: var(--outline-variant); overflow: hidden; }
.linear div { height: 100%; width: 40%; background: var(--primary); border-radius: 2px; animation: lin 1.1s ease-in-out infinite; }
@keyframes lin { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

/* ---- Main shell: bottom navigation ---- */
.navbar { display: flex; flex: none; height: 76px; background: color-mix(in srgb, var(--primary) 6%, var(--surface)); padding: 10px 0 12px; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.nav-ind { position: relative; width: 60px; height: 32px; border-radius: 16px; display: grid; place-items: center; color: var(--on-surface-variant); }
.nav-item.on .nav-ind { background: var(--primary-container); color: var(--on-primary-container); }
.nav-label { font-size: 12px; font-weight: 600; color: var(--on-surface-variant); } .nav-item.on .nav-label { color: var(--on-bg); }
.badge { position: absolute; top: -2px; right: 10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--error); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.badge.dot { min-width: 7px; width: 7px; height: 7px; padding: 0; top: 4px; right: 16px; background: var(--primary); }

/* ---- Home ---- */
.home-hdr { display: flex; align-items: center; padding: 10px 8px 0 20px; }
.addr { display: flex; align-items: center; flex: 1; min-width: 0; text-align: left; }
.loc { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-container); color: var(--tertiary); display: grid; place-items: center; flex: none; }
.mode { display: flex; background: var(--surface-variant); border-radius: 14px; padding: 4px; }
.mode button { flex: 1; display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 10px; font-weight: 600; font-size: 15px; color: var(--on-surface-variant); }
.mode button.on { background: var(--bg); color: var(--on-bg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.fake-search { display: flex; align-items: center; margin: 14px 20px 6px; height: 52px; border-radius: 16px; background: var(--surface-variant); padding: 0 16px; color: var(--on-surface-variant); width: calc(100% - 40px); }
.cat { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 10px; font-size: 13px; font-weight: 600; width: 72px; }
.cat .plate { transition: transform .2s; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--outline-variant); font-size: 14px; font-weight: 600; white-space: nowrap; }
.fchip.on { background: var(--on-bg); color: var(--bg); border-color: var(--on-bg); }
.fchip.m3 { border-radius: 8px; height: 32px; padding: 0 12px; border-width: 1px; border-color: var(--outline); }
.fchip.m3.on { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }
.achip { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--outline); font-size: 14px; font-weight: 500; white-space: nowrap; }
.achip:hover { background: color-mix(in srgb, var(--on-bg) 6%, transparent); }
.feature { position: relative; display: block; margin: 14px 20px 4px; height: 168px; border-radius: 22px; background: var(--primary); color: #fff; overflow: hidden; width: calc(100% - 40px); text-align: left; }
.feature-glow { position: absolute; right: -50px; top: -50px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.12); }
.feature-plate { position: absolute; right: -14px; bottom: -22px; width: 170px; transform: rotate(-12deg); }
.feature-text { position: absolute; left: 20px; top: 20px; right: 150px; display: flex; flex-direction: column; gap: 6px; }
.feature-title { font-size: 22px; line-height: 27px; font-weight: 700; }
.feature-chip { position: absolute; left: 20px; bottom: 18px; background: #fff; color: #111; font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 999px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 20px 12px; }
.rcard { cursor: pointer; display: block; min-width: 0; }
.cover { position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: var(--surface-variant); }
.fill-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dots { position: absolute; inset: 0; background-image: radial-gradient(color-mix(in srgb, var(--primary) 25%, transparent) 1.6px, transparent 1.8px); background-size: 16px 16px; }
.cover-plate { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-8deg); }
.free-chip { position: absolute; left: 10px; top: 10px; background: var(--primary); color: var(--on-primary); font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 12px; }
.heart { position: absolute; right: 10px; top: 10px; }
.meta { display: flex; align-items: center; font-size: 14px; margin-top: 2px; min-width: 0; }
.plate { display: block; flex: none; overflow: visible; }
.steam { animation: steam 2.4s ease-in-out infinite; }
.steam:nth-of-type(2) { animation-delay: .4s; } .steam:nth-of-type(3) { animation-delay: .8s; }
@keyframes steam { 0%,100% { opacity: .25; transform: translateY(2px); } 50% { opacity: .9; transform: translateY(-2px); } }
.pulse { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px) rotate(-3deg); } }

/* ---- Restaurant ---- */
.rest { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.banner { position: relative; height: 230px; background: var(--primary-container); overflow: hidden; }
.banner-plate { position: absolute; width: 220px; left: 50%; top: 46%; transform: translate(-50%, -50%) rotate(-10deg); }
.rinfo { position: relative; margin: -26px 0 0; background: var(--bg); border-radius: 28px 28px 0 0; padding: 22px 20px 10px; }
.stats { display: flex; align-items: center; margin-top: 14px; border: 1.5px solid var(--outline-variant); border-radius: 16px; padding: 12px 0; }
.stats > div { flex: 1; display: flex; flex-direction: column; align-items: center; } .stats > i { width: 1px; height: 32px; background: var(--outline-variant); }
.ribbon { background: var(--primary-container); color: var(--on-primary-container); font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 12px; }
.sticky-menu { position: sticky; top: 0; background: var(--bg); z-index: 2; }
.dish-row { display: block; width: 100%; padding: 0 20px; text-align: left; }
.dish-row:hover { background: color-mix(in srgb, var(--on-bg) 3%, transparent); }
.dish-pic { position: relative; flex: none; }
.dish-img { border-radius: 16px; object-fit: cover; }
.add-btn { position: absolute; right: -6px; bottom: -6px; width: 34px; height: 34px; border-radius: 50%; background: var(--bg); color: var(--on-bg); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.2); font-weight: 700; font-size: 15px; }
.add-btn.on { background: var(--primary); color: var(--on-primary); }
.float-top { position: absolute; left: 16px; right: 16px; top: 12px; display: flex; justify-content: space-between; z-index: 3; }
.view-cart { position: absolute; left: 20px; right: 20px; bottom: 16px; height: 58px; border-radius: 16px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; gap: 12px; padding: 0 16px; font-weight: 600; font-size: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 3; }
.view-cart span:nth-child(2) { flex: 1; text-align: center; }
.vc-count { min-width: 28px; height: 28px; border-radius: 14px; background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: 14px; }

/* ---- Cart / checkout ---- */
.stepper { display: inline-flex; align-items: center; }
.nudge { background: var(--primary-container); color: var(--on-primary-container); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 600; }
.promo { border: 1.5px dashed var(--outline); border-radius: 20px; padding: 16px; }
.tip { flex: 1; display: flex; align-items: center; justify-content: center; height: 42px; border-radius: 12px; border: 1.5px solid var(--outline-variant); font-weight: 600; }
.tip.on { background: var(--on-bg); color: var(--bg); border-color: var(--on-bg); }
.tline { display: flex; justify-content: space-between; padding: 3px 0; font-size: 15px; color: var(--on-surface-variant); }
.tline.hi { color: var(--success); font-weight: 600; }
.bottom-pad { padding: 12px 20px 14px; flex: none; }
.pay-row { display: flex; align-items: center; width: 100%; padding: 10px 0; text-align: left; }
.pay-badge { width: 52px; height: 32px; border-radius: 8px; background: var(--surface-variant); font-size: 11px; font-weight: 700; display: grid; place-items: center; letter-spacing: .5px; }

/* ---- Orders / profile ---- */
.active-card { display: flex; flex-direction: column; width: 100%; text-align: left; background: var(--primary-container); color: var(--on-primary-container); border-radius: 20px; padding: 16px; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 24px; font-weight: 700; flex: none; }
.menu-row { display: flex; align-items: center; width: 100%; padding: 10px 0; text-align: left; }
.panel .menu-row:first-child { padding-top: 0; } .panel .menu-row:last-child { padding-bottom: 0; }

/* ---- Tracking ---- */
.big-min { font-size: 56px; line-height: 58px; font-weight: 700; letter-spacing: -1.5px; }
.route-box { border-radius: 22px; overflow: hidden; background: var(--surface-variant); }
.route { display: block; width: 100%; height: auto; }
.rider { transition: transform 1s linear; }
.step { display: flex; align-items: stretch; position: relative; }
.step-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--outline-variant); flex: none; display: grid; place-items: center; background: var(--bg); position: relative; z-index: 1; color: var(--on-primary); }
.step::before { content: ""; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--outline-variant); }
.step.last::before { display: none; }
.step.done .step-dot { background: var(--primary); border-color: var(--primary); } .step.done::before { background: var(--primary); }
.step.cur .step-dot { border-color: var(--primary); } .step.cur .step-dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.star-btn { padding: 4px; }
.drv-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary-container); color: var(--on-primary-container); display: grid; place-items: center; font-weight: 700; font-size: 20px; flex: none; }

/* ---- Chat ---- */
.list8 { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 290px; padding: 12px; border-radius: 16px; font-size: 16px; line-height: 23px; white-space: pre-wrap; word-wrap: break-word; }
.bubble.bot { background: var(--surface-variant); color: var(--on-surface-variant); align-self: flex-start; }
:root[data-resolved="light"] .bubble.bot { color: #2b2825; }
.bubble.me { background: var(--primary); color: var(--on-primary); }
.bubble.typing { animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .55; } }
.cardb { max-width: 300px; border: 1.5px solid var(--outline-variant); border-radius: 16px; padding: 14px; align-self: flex-start; width: 100%; }
.notice { text-align: center; font-size: 13px; line-height: 18px; color: var(--on-surface-variant); padding: 2px 24px; }
.bottom-bar { flex: none; background: color-mix(in srgb, var(--primary) 6%, var(--surface)); }
.qr { padding-bottom: 0; }
.dropdown { position: absolute; right: 12px; top: 58px; z-index: 30; background: var(--bg); border-radius: 6px; box-shadow: 0 6px 22px rgba(0,0,0,.25); padding: 8px 0; min-width: 210px; border: 1px solid var(--outline-variant); }
.dropdown button { display: block; width: 100%; padding: 13px 16px; font-size: 15px; text-align: left; }
.dropdown button:hover { background: color-mix(in srgb, var(--on-bg) 7%, transparent); }

/* ---- Call ---- */
.call { background: linear-gradient(180deg, var(--primary-container), var(--bg) 70%); }
.call-avatar { width: 112px; height: 112px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 46px; font-weight: 700; }
.call-toggle { width: 64px; height: 64px; border-radius: 50%; background: var(--surface-variant); display: grid; place-items: center; font-size: 22px; font-weight: 700; }
.call-toggle.on { background: var(--on-bg); color: var(--bg); }
.end-call { width: 76px; height: 76px; border-radius: 50%; background: #DC2626; color: #fff; display: grid; place-items: center; }

/* ---- Complaints ---- */
.tracker { display: flex; position: relative; }
.tracker::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 6px; height: 2px; background: var(--outline-variant); }
.tstep { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
.tdot { width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--outline-variant); }
.tdot.on { background: var(--primary); border-color: var(--primary); }
.drow { display: flex; justify-content: space-between; gap: 14px; padding: 4px 0; } .drow > :last-child { text-align: right; }

/* ---- Overlays ---- */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.42); z-index: 20; animation: fade .15s; }
.scrim.clear { background: transparent; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 90%; background: var(--bg); border-radius: 28px 28px 0 0; z-index: 21; display: flex; flex-direction: column; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(40%); opacity: 0; } }
.handle { width: 32px; height: 4px; border-radius: 2px; background: var(--outline); align-self: center; margin: 14px 0 6px; opacity: .6; flex: none; }
.sheet-scroll { overflow-y: auto; padding: 0 20px; flex: 1; min-height: 0; }
.opt-row { display: flex; align-items: center; width: 100%; padding: 2px 0; text-align: left; }
.add-cart { flex: 1; justify-content: space-between; min-height: 52px; }
.dialog { position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); z-index: 21; background: var(--bg); border-radius: 28px; padding: 24px 20px 14px 24px; box-shadow: 0 10px 40px rgba(0,0,0,.3); max-height: 86%; display: flex; flex-direction: column; }
:root[data-resolved="dark"] .dialog, :root[data-resolved="dark"] .dropdown, :root[data-resolved="dark"] .sheet { background: #161616; }
:root[data-resolved="dark"] .dialog .tf-box label { background: #161616; }
.dialog-body { margin-top: 14px; min-height: 0; overflow-y: auto; padding-right: 4px; }
.snack { position: absolute; left: 12px; right: 12px; bottom: 90px; z-index: 25; background: var(--inverse); color: var(--on-inverse); border-radius: 6px; padding: 6px 8px 6px 16px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.25); animation: up .2s; }
#toast { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%) translateY(16px); background: #333; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 40; max-width: 320px; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

      const texts = [];
      let chips;
      if (order && order.active) {
        texts.push(`${hello} ${this.stageSummary(order)}`);
        chips = this.stageChips(order);
      } else {
        texts.push(order ? `${hello} I can see your last order from ${order.restaurantName} on ${Fmt.date(order.placedAt)}. What can I help with?` : `${hello} What can I help with?`);
        chips = menuChips();
      }
      if (note) texts.push(note);
      const withC = open.length > 0 && !chips.some((c) => c.action.type === 'Pick' && c.action.intent === 'ComplaintStatus') ? chips.concat([pick('ComplaintStatus')]) : chips;
      return reply('Greeting', texts, { quickReplies: withC });
    }

    statusUpdate(order) {
      let text;
      switch (order.state.name) {
        case 'Received': return null;
        case 'Preparing': text = `Update: ${order.restaurantName} has started preparing your food.`; break;
        case 'OnTheWay': text = order.pickup ? `Update: your order is ready for pick-up at ${order.restaurantName}, ${order.restaurantArea}.`
          : `Update: ${order.driverName != null ? order.driverName : 'your driver'} has picked up your order and is about ${Fmt.minutes(order.minutesLeft != null ? order.minutesLeft : 1)} away.`; break;
        case 'Delivered': text = order.pickup ? "Update: you've collected your order. Enjoy! If anything isn't right, tell me."
          : "Update: your order has been delivered. Enjoy! If anything isn't right, tell me."; break;
        default: text = "Update: this order was cancelled. You won't be charged.";
      }
      return reply('WhereIsOrder', [text], { quickReplies: this.stageChips(order) });
    }

    respond(input, state, ctx) {
      let res;
      if (input.type === 'Choice') res = this.onChoice(input.action, copy(state, { misses: 0 }), ctx);
      else if (input.type === 'Text') res = this.onText(input.text, input.allowAi !== false, state, ctx);
      else {
        const r = this.onIntent(input.intent, input.text, copy(state, { misses: 0 }), ctx);
        res = result(copy(r.reply, { source: 'Ai' }), r.state);
      }
      return this.offerFollowUp(res);
    }

    /** After the first problem is dealt with, offer to sort out the second one the customer mentioned. */
    offerFollowUp(res) {
      const f = res.state.followUp;
      if (!f || res.reply.askAi || res.state.awaiting.type !== 'Nothing') return res;
      if (res.reply.intent === f.intent) return result(res.reply, copy(res.state, { followUp: null }));
      return result(copy(res.reply, {
        afterTexts: (res.reply.afterTexts || []).concat([`You also mentioned ${FOLLOW_UPS[f.intent]}. Shall we sort that out now?`]),
        quickReplies: [qr(A('FollowUpYes'), 'Yes, sort that out'), qr(A('FollowUpNo'), "No, that's all")].concat(res.reply.quickReplies.filter((q) => q.action.type !== 'Menu')),
      }), copy(res.state, { followUp: null, awaiting: W('FollowUpOffer', { intent: f.intent, text: f.text }) }));
    }

    notUnderstood(state, ctx) {
      const misses = state.misses + 1;
      if (misses >= LOOP_BREAKER) {
        // Don't keep guessing, and don't log a complaint about nothing: offer a person instead.
        return result(reply('Unknown', ["Sorry, I'm still not sure what you mean. I can bring in a person to help, or you can pick one of these."], {
          quickReplies: [human(), qr(A('Call'), 'Call an agent')].concat(menuChips()),
        }), copy(state, { misses: 0, awaiting: W('Nothing') }));
      }
      return result(reply('Unknown', ["Sorry, I didn't quite get that. Could you tell me in a few words what's wrong, or pick one of these?"], { quickReplies: menuChips() }),
        copy(state, { misses, awaiting: W('Nothing') }));
    }

    frustratedUnknown(text, state, ctx) {
      const count = state.frustration + 1;
      if (count < FRUSTRATION_LIMIT) {
        return result(reply('Unknown', ["I'm sorry, I can tell this has been frustrating. Tell me what went wrong in a few words and I'll sort it out, or I can get a person to help."],
          { quickReplies: [human()].concat(menuChips()) }), copy(state, { frustration: count, awaiting: W('Nothing') }));
      }
      const o = this.orderFor(state, ctx);
      return this.escalate('Unknown', ["I'm really sorry, I can hear how frustrating this is. Let me get a person to take over right away."],
        E(Category.CustomerService, 'Customer Frustrated', Severity.High, o ? o.id : null, o ? o.restaurantName : null,
          withWords('The customer is upset and asked for help more than once.', text)), copy(state, { frustration: 0 }), ctx);
    }

    onText(text, allowAi, state, ctx) {
      const order = this.orderFor(state, ctx);
      const m0 = copy(state, { misses: 0 });
      // Only punctuation or emoji: show the menu (or acknowledge an angry emoji), never count it as a miss.
      if (TextNormaliser.tokens(text).length === 0) {
        return this.classifier.isFrustrated(text) ? this.frustratedUnknown(text, state, ctx) : this.greeting(m0, ctx);
      }
      const correcting = this.classifier.isCorrection(text);
      if (!correcting) {
        const handled = this.answerAwaiting(text, order, m0, ctx);
        if (handled) return handled;
      }

      const found = this.classifier.classify(text);
      if (state.awaiting.type === 'NewAddress' && order &&
        (found.intent === 'Unknown' || found.intent === 'Ack' || (found.intent === 'ChangeAddress' && this.looksLikeAddress(text)))) {
        if (found.intent !== 'Ack' || this.looksLikeAddress(text)) return this.newAddress(order, text, m0, ctx);
      }
      let intent = found.intent;
      if (correcting) {
        // "No, that's wrong" alone asks what they meant; "not that, my coke is missing" goes straight to the coke.
        const rest = this.withoutCorrection(text);
        const again = rest === '' ? null : this.classifier.classify(rest);
        intent = again && !['Unknown', 'Correction', 'Ack', 'Greeting', 'Thanks', 'Goodbye'].includes(again.intent) ? again.intent : 'Correction';
      }
      const frustrated = this.classifier.isFrustrated(text);
      let focus = text;
      let followUp = state.followUp;
      if (!correcting && found.source !== 'Learned') {
        const plan = this.planProblems(text, intent, order);
        if (plan) { intent = plan.primary; focus = plan.focus; if (plan.secondary) followUp = plan.secondary; }
      }
      intent = this.inContext(text, intent, order);
      if (this.isComplaintFollowUp(text, intent, ctx)) return this.complaintFollowUp(text, m0, ctx);
      const weakOnly = found.source === 'Rules' && found.confidence < STRONG_ENOUGH && !['Greeting', 'Thanks', 'Goodbye', 'Ack'].includes(intent);
      if (allowAi && ctx.aiAvailable && !frustrated && (intent === 'Unknown' || weakOnly)) {
        return result(reply('Unknown', [], { askAi: true }), state);
      }
      if (intent === 'Unknown') return frustrated ? this.frustratedUnknown(text, state, ctx) : this.notUnderstood(state, ctx);
      const fresh = copy(state, { misses: 0, frustration: frustrated ? state.frustration + 1 : 0, followUp });
      if (frustrated && fresh.frustration >= FRUSTRATION_LIMIT && !CALM.has(intent)) {
        const o = this.orderFor(fresh, ctx);
        return this.escalate(intent, ["I'm really sorry, I can hear how frustrating this is. Let me get a person to take over right away."],
          E(Category.CustomerService, 'Customer Frustrated', Severity.High, o ? o.id : null, o ? o.restaurantName : null,
            withWords('The customer is upset and asked for help more than once.', text)),
          copy(fresh, { frustration: 0 }), ctx);
      }
      const r = this.onIntent(intent, focus, fresh, ctx);
      const rep = copy(r.reply, { source: found.source });
      if (!frustrated || CALM.has(intent)) return result(rep, r.state);
      const empathy = "I'm sorry, I can tell this has been frustrating.";
      const chips = rep.quickReplies.some((q) => q.action.type === 'Human') ? rep.quickReplies : rep.quickReplies.concat([human()]);
      const texts = rep.texts.length === 0 ? [empathy] : [`${empathy} ${rep.texts[0]}`].concat(rep.texts.slice(1));
      return result(copy(rep, { texts, quickReplies: chips }), r.state);
    }

    /** Typed answers to the question the bot just asked (buttons work too, but people type). */
    answerAwaiting(text, order, m0, ctx) {
      const a = m0.awaiting;
      const t = TextNormaliser.tokens(text);
      const all = /\b(everything|all of it|all of them|the whole order|whole order|entire order|the lot|nothing came|all)\b/;
      switch (a.type) {
        case 'MissingWhich': {
          if (!order) break;
          const items = this.missingItems(text, order);
          if (items.length) return this.missingFor(order, items, m0, a.tamper);
          if (has(text, all)) return this.neverArrived(order, m0, ctx, text);
          break;
        }
        case 'WrongWhich': {
          if (!order) break;
          const idx = this.findItems(text, order);
          if (idx.length) return this.wrongItems(order, idx, m0);
          if (has(text, all)) return this.onChoice(A('WholeOrderWrong'), m0, ctx);
          break;
        }
        case 'QualityWhich': {
          if (!order) break;
          if (has(text, /\b(just tell|tell them|tell the restaurant|let them know|feedback)\b/)) return this.onChoice(A('TellRestaurant'), m0, ctx);
          const idx = this.findItems(text, order);
          if (idx.length) return this.qualityAction(order, a.kind, idx, m0);
          if (has(text, all) || has(text, /\b(the food|my food|the meal|both)\b/)) return this.qualityAction(order, a.kind, order.lines.map((_, i) => i), m0);
          break;
        }
        case 'MissingHowMany': {
          const m = text.match(/\d+/);
          let qty = m ? Number(m[0]) : null;
          if (qty !== null && qty > 2147483647) qty = null;
          if (qty === null) qty = this.wordNumber(text);
          if (qty !== null && qty > 0) return this.onChoice(A('ChooseQty', { qty }), m0, ctx);
          break;
        }
        case 'ChargeWhat': { const k = this.chargeKind(text, order); if (k) return this.chargeAnswer(k, m0, ctx); break; }
        case 'QualityWhat': {
          if (!order) break;
          const k = this.qualityKind(text);
          if (k) { const idx = this.findItems(text, order); return this.chooseQuality(order, k, m0, idx.length ? idx : (a.indexes || [])); }
          break;
        }
        case 'WrongScope': {
          if (!order) break;
          if (has(text, /\b(whole|all|everything|entire|full|someone else|not mine|not my)\b/)) return this.onChoice(A('WholeOrderWrong'), m0, ctx);
          const idx = this.findItems(text, order);
          if (idx.length) return this.wrongItems(order, idx, m0);
          if (hasAny(t, S('some', 'one', 'only', 'part', 'item', 'items', 'few', 'just'))) return this.onChoice(A('SomeItemsWrong'), m0, ctx);
          break;
        }
        case 'DeliveryCheck':
          if (order && this.findItems(text, order).length && this.findItems(text, order).length < order.lines.length) {
            return this.missingFor(order, this.missingItems(text, order), m0, false);
          }
          if (has(text, /\b(found it|got it|its here|it was there|found)\b/) && !has(text, /\b(not|no|didnt|havent|cant)\b/)) return this.onChoice(A('FoundIt'), m0, ctx);
          if (has(text, /\b(no|not|nothing|nowhere|checked|looked|still|nope|nah|already)\b/)) return this.onChoice(A('CheckedEverywhere'), m0, ctx);
          break;
        case 'CancelConfirm': {
          const yn = this.cancelAnswer(text);
          if (yn === true) return this.onChoice(A('ConfirmCancel'), m0, ctx);
          if (yn === false) return this.onChoice(A('KeepOrder'), m0, ctx);
          break;
        }
        case 'LateChoice':
          if (has(text, /\b(keep waiting|ill wait|i will wait|i can wait|happy to wait|ill keep waiting|keep it|its fine|no cancel|dont cancel|no thanks)\b/) && !has(text, /\b(still|cancel it|cancel please)\b/)) return this.onChoice(A('KeepWaiting'), m0, ctx);
          if (has(text, /\b(cancel|yes|yeah|please|dont want|do not want)\b/)) return this.onChoice(A('ConfirmCancel'), m0, ctx);
          break;
        case 'RefundMethodChoice':
          if (has(text, /\b(credit|voucher|wallet|app|account credit)\b/) && !has(text, /\bbank\b/)) return this.onChoice(A('ChooseMethod', { method: RefundMethod.EatsCredit }), m0, ctx);
          if (has(text, /\b(bank|transfer|eft|account|cash)\b/)) return this.onChoice(A('ChooseMethod', { method: RefundMethod.BankTransfer }), m0, ctx);
          break;
        case 'OrderChoice': {
          const match = this.orderFromText(text, ctx);
          if (match) return this.onChoice(A('ChooseOrder', { orderId: match.id }), m0, ctx);
          // still need to know which order: ask again rather than wander off
          if (['RefundStatus', 'Ack', 'Unknown', 'Greeting', a.intent].includes(this.classifier.classify(text).intent) && ctx.orders.length > 1) {
            return result(reply(a.intent, ['Sure. First, which order is this about? Tap it below.'], {
              quickReplies: ctx.orders.slice(0, 3).map((o) => qr(A('ChooseOrder', { orderId: o.id }), this.orderLabel(o))),
            }), m0);
          }
          break;
        }
        case 'MissingAction': case 'QualityAction': case 'WrongAction': {
          const whole = a.type === 'WrongAction' && a.indexes === null;
          if (whole && has(text, /\b(redeliver|resend|send (it|the|my|me|a)|replace|replacement|correct order|new order|right order|deliver the right)\b/)) return this.onChoice(A('Redeliver'), m0, ctx);
          const noRefund = has(text, /\b(no refund|dont want a refund|dont need a refund|not a refund|no money)\b/);
          if (!noRefund && has(text, /\b(refund|money back|money|reimburse|credit|yes|yeah|yep|please|ok|okay|sure|ja|yebo)\b/)) {
            return this.onChoice(A(whole ? 'FullRefund' : 'ItemRefund'), m0, ctx);
          }
          if (noRefund || has(text, /\b(tell|let them know|feedback|inform|report|no thanks|no|nah|nope|just)\b/)) return this.onChoice(A('TellRestaurant'), m0, ctx);
          break;
        }
        case 'FollowUpOffer':
          if (has(text, /\b(yes|yeah|yep|ja|please|sure|ok|okay|go ahead|sort it|yebo)\b/)) return this.onChoice(A('FollowUpYes'), m0, ctx);
          if (has(text, /\b(no|nope|nah|thats all|that is all|its fine|dont worry|leave it)\b/)) return this.onChoice(A('FollowUpNo'), m0, ctx);
          break;
        default: break;
      }
      const live = order && order.active && order.state.inProgress;
      if (live && has(text, /^(ok |okay |fine |no )?(ill|i will|i can|happy to|ill just) (keep )?wait/)) return this.onChoice(A('KeepWaiting'), m0, ctx);
      if (live && !order.pickup && order.state !== OrderState.OnTheWay && a.type === 'Nothing' && this.isStreetAddress(text) && this.classifier.classify(text).intent === 'Unknown') {
        const address = text.trim().replace(/[.!]+$/, '').slice(0, MAX_ADDRESS);
        return result(reply('ChangeAddress', [`Would you like your order delivered to ${address} instead of ${order.address}?`], {
          quickReplies: [qr(A('UseAddress', { address }), 'Yes, use this address'), qr(A('KeepOrder'), 'No, keep it')],
        }), copy(m0, { orderId: order.id, awaiting: W('AddressConfirm', { address }) }));
      }
      if (a.type === 'AddressConfirm' && order) {
        if (has(text, /\b(yes|yeah|yep|ja|please|sure|ok|okay|correct|use it)\b/)) return this.newAddress(order, a.address, m0, ctx);
        if (has(text, /\b(no|nope|nah|keep|wrong)\b/)) return this.onChoice(A('KeepOrder'), m0, ctx);
      }
      return null;
    }

    isStreetAddress(text) {
      return /\d/.test(text) && /\b(street|st|road|rd|avenue|ave|drive|dr|lane|ln|close|crescent|cres|way|place|pl|terrace|boulevard|blvd|court|ct|complex|estate|flat|unit)\b/i.test(text) && this.looksLikeAddress(text);
    }

    /** Readings that depend on the order: "where are my chips" after delivery means they're missing. */
    inContext(text, intent, order) {
      if (!order || !order.active) return intent;
      const delivered = order.state === OrderState.Delivered;
      if (delivered && ['WhereIsOrder', 'Unknown', 'Greeting', 'Ack', 'NeverArrived'].includes(intent)) {
        const items = this.findItems(text, order);
        if (items.length && items.length < order.lines.length &&
          has(text, /\b(where|no|not|didnt|never|missing|wasnt|werent|without|forgot|left|arent|isnt|nowhere)\b/)) return 'MissingItem';
      }
      if (intent === 'WrongOrder' && delivered && has(text, /\b(only (got|received|came)|got only|received only|only (\d+|one|two|three)\b|(\d+|one|two|three) \w+ (came|arrived) instead of (\d+|two|three|four)|(got|received) (\d+|one|two|three)\b.*\b(ordered|asked for|paid for) (\d+|two|three|four))/)) return 'MissingItem';
      if (intent === 'Allergens' && delivered && has(text, /\b(had|contained|contains|was in|there was|ate|eaten|reaction|swollen|swelling|itchy|rash|cant breathe)\b/)) return 'FoodSafety';
      if (intent === 'Unknown' && order.state.inProgress && has(text, /\b(where|when|how long|status|eta|update)\b/) && has(text, /\b(food|order|it|driver|delivery)\b/)) return 'WhereIsOrder';
      return intent;
    }

    cancelAnswer(text) {
      const n = TextNormaliser.normalise(text);
      const wantsOut = /\b(dont want|do not want|changed my mind|cancel it|cancel the order|cancel please|please cancel|go ahead|do it)\b/.test(n);
      if (!wantsOut && /\b(dont cancel|do not cancel|keep|never ?mind|leave it|no|nope|nah|not now|wait)\b/.test(n)) return false;
      if (wantsOut || /\b(yes|yeah|yep|ja|yebo|sure|ok|okay|please|cancel)\b/.test(n)) return true;
      return null;
    }

    withoutCorrection(text) {
      const n = TextNormaliser.normalise(text)
        .replace(/\b(no|nope|nah|thats|that is|its|it is|not|what|i|you|meant|mean|asked|said|wrong|right|it|misunderstood|dont understand|you got|got|that|one|didnt|doesnt|help|helpful|answer)\b/g, ' ')
        .replace(/\s+/g, ' ').trim();
      return n;
    }

    /** Several problems in one message: handle the most urgent first and remember the next one. */
    planProblems(text, top, order) {
      const keepTop = !PRIORITY.includes(top) && !['Greeting', 'Ack', 'Thanks', 'SmallTalk', 'Unknown', 'Goodbye'].includes(top);
      if (keepTop) return null;
      const all = this.classifier.ranked(text);
      const best = all.length ? all[0].confidence : 0;
      // A weaker reading counts only if it comes from its own part of the message ("..., and the kota was cold").
      const clauses = text.split(/\b(?:and|but|also|plus|then)\b|[,.;!?]/i).filter((p) => TextNormaliser.tokens(p).length > 0);
      const ownClause = (c) => clauses.length > 1 && clauses.some((p) => this.classifier.ranked(p).some((x) => x.intent === c.intent) &&
        !this.classifier.ranked(p).some((x) => x.intent !== c.intent && x.confidence > c.confidence && PRIORITY.includes(x.intent)));
      const top0 = all[0];
      const ranked = all.filter((c) => c.confidence >= 0.8 && (c.confidence >= best - 0.15 || ownClause(c)) &&
        // in the same clause, a shorter match than the winner's is just part of the same sentence ("the address on the order is wrong")
        !(top0 && c !== top0 && !ownClause(c) && TextNormaliser.tokens(c.matched || '').length < TextNormaliser.tokens(top0.matched || '').length));
      const toks = (c) => TextNormaliser.tokens(c.matched || '');
      const inside = (c) => ranked.some((d) => d !== c && toks(d).length > toks(c).length && toks(c).every((w) => toks(d).includes(w)));
      const negated = new Set();
      const neg = /\b(not|nothing|isnt|wasnt|arent|werent|never|no) (missing|wrong|cold|late)\b/g;
      for (const m of TextNormaliser.normalise(text).matchAll(neg)) negated.add({ missing: 'MissingItem', wrong: 'WrongOrder', cold: 'FoodQuality', late: 'Late' }[m[2]]);
      let set = Array.from(new Set(ranked.filter((c) => PRIORITY.includes(c.intent) && !inside(c) && !negated.has(c.intent)).map((c) => c.intent)));
      if (set.length === 0) return null;
      if (set.includes('FoodSafety')) set = set.filter((i) => i !== 'FoodQuality');
      if (set.includes('NeverArrived') && set.includes('MissingItem')) {
        const partial = has(text, /\b(some|part|half|few|one of|only)\b/) || (order && this.findItems(text, order).length > 0);
        set = set.filter((i) => i !== (partial ? 'NeverArrived' : 'MissingItem'));
      }
      if (set.includes('CancelOrder')) set = set.filter((i) => i !== 'Late');
      if (set.some((i) => i !== 'RefundStatus' && i !== 'WhereIsOrder')) set = set.filter((i) => i !== 'RefundStatus' && i !== 'WhereIsOrder');
      set.sort((x, y) => PRIORITY.indexOf(x) - PRIORITY.indexOf(y));
      const primary = set[0];
      const secondary = set.slice(1).find((i) => FOLLOW_UPS[i]);
      if (!secondary) return { primary, focus: text, secondary: null };
      return { primary, focus: this.clauseFor(text, primary), secondary: { intent: secondary, text: this.clauseFor(text, secondary) } };
    }

    clauseFor(text, intent) {
      const parts = text.split(/\b(?:and|but|also|plus|then)\b|[,.;!?]/i).map((p) => p.trim()).filter((p) => TextNormaliser.tokens(p).length > 0);
      return parts.find((p) => this.classifier.ranked(p).some((c) => c.intent === intent)) || text;
    }

    newestOpen(ctx) { return maxBy(ctx.complaints.filter((c) => c.status.isOpen), (c) => c.createdAt); }

    isComplaintFollowUp(text, intent, ctx) {
      if (!['WhereIsOrder', 'Late', 'Unknown', 'Ack'].includes(intent)) return false;
      if (!TIMING.test(TextNormaliser.normalise(text))) return false;
      if (ctx.orders.some((o) => o.active && o.state.inProgress)) return false;
      const c = this.newestOpen(ctx);
      return !!c && ctx.now - c.createdAt <= 2 * HOUR;
    }

    complaintFollowUp(text, state, ctx) {
      const c = this.newestOpen(ctx);
      const speed = has(text, /\b(speed|hurry|faster|quicker|asap|urgent)\b/);
      const when = c.severity === Severity.Critical ? 'is Critical, so a person is being assigned to it right now'
        : `will be picked up by a person by ${Fmt.due(c.dueAt, ctx.now)}`;
      const texts = [`Your complaint ${reference(c)} (${c.subcategory}) ${when}.` +
        (c.refund ? ` Your refund of ${Fmt.money(c.refund.amount)} is ${c.refund.status.label.toLowerCase()}; once approved it arrives ${c.refund.method.timing}.` : '')];
      let chips;
      if (speed && c.severity !== Severity.Critical && !c.escalated) {
        texts.push('I can ask a supervisor to look at it sooner, or you can call an agent now.');
        chips = [qr(A('ChaseComplaint'), 'Raise it to a supervisor'), qr(A('Call'), 'Call an agent')];
      } else {
        texts.push("If you'd rather not wait, you can call an agent now.");
        chips = [this.viewChip(c), qr(A('Call'), 'Call an agent')];
      }
      return result(reply('ComplaintStatus', texts, { card: this.complaintCard(c, ctx.now), quickReplies: chips, answered: true }), copy(state, { awaiting: W('Nothing') }));
    }

    onIntent(intent, text, state, ctx) {
      if (NEEDS_ORDER.has(intent) && ctx.orders.length === 0) return this.noOrder(intent, state);
      if (PAST_ORDER_PROBLEMS.has(intent) && state.orderId === null) {
        const named = this.orderFromText(text, ctx);
        if (named) state = copy(state, { orderId: named.id });
        else if (!ctx.orders.some((o) => o.active) && ctx.orders.length > 1) return this.askWhichOrder(intent, text, state, ctx);
      }
      const order = this.orderFor(state, ctx);
      const s = PROBLEMS.has(intent) ? copy(state, { lastProblem: intent }) : state;
      switch (intent) {
        case 'WhereIsOrder': return this.whereIsOrder(order, s, ctx, [], text);
        case 'NeverArrived': return this.neverArrived(order, s, ctx, text);
        case 'Late': return this.late(order, s, ctx, text);
        case 'MissingItem': return this.missingItem(order, text, s, ctx);
        case 'WrongOrder': return this.wrongOrder(order, text, s, ctx);
        case 'FoodQuality': return this.foodQuality(order, text, s, ctx);
        case 'FoodSafety': return this.foodSafety(order, text, s, ctx);
        case 'RefundStatus': return this.refundStatus(order, s, ctx, text);
        case 'PaymentProblem': return this.paymentProblem(text, s, ctx);
        case 'PoorSupport': return this.poorSupport(text, s, ctx);
        case 'CancelOrder': return this.cancelOrder(order, s, ctx);
        case 'ChangeAddress': return this.changeAddress(order, s, text, ctx);
        case 'ModifyOrder': return this.modifyOrder(order, s);
        case 'ContactDriver': return this.contactDriver(order, s, text);
        case 'DriverIssue': return this.driverIssue(order, text, s, ctx);
        case 'OrderDetails': return this.orderDetails(order, s);
        case 'Fees': return this.fees(order, s);
        case 'Promo': return this.promo(text, s);
        case 'Tip': return this.tip(order, s);
        case 'PaymentMethods': return this.payMethods(text, s);
        case 'Pickup': return this.pickup(order, s, text, ctx);
        case 'Allergens': return has(text, /\b(halal|vegan|vegetarian|kosher|plant based)\b/) ? this.serviceInfo(text, s) : this.info('Allergens', Guidelines.ALLERGENS, s);
        case 'Account': return this.account(text, s, ctx);
        case 'DeliveryInstructions': return this.deliveryInstructions(order, s, text);
        case 'Rate': return this.rate(order, s);
        case 'ComplaintStatus': return this.complaintStatus(s, ctx);
        case 'TalkToHuman': return this.handOff(text, s, ctx);
        case 'CallAgent': return this.callAgent(s);
        case 'SmallTalk': return this.smallTalk(text, s, ctx);
        case 'Ack': return this.ack(s, ctx);
        case 'ServiceInfo': return this.serviceInfo(text, s);
        case 'WillBeCharged': return this.willBeCharged(order, s, ctx);
        case 'Correction': return this.correction(s);
        case 'Greeting': return this.greeting(s, ctx);
        case 'Thanks': return this.done('Thanks', `You're welcome, ${ctx.firstName}. Anything else I can help with?`, s);
        case 'Goodbye': return result(reply('Goodbye', [`Thanks for chatting, ${ctx.firstName}. Enjoy your meal!`], { quickReplies: [qr(A('Menu'), 'I need something else')] }),
          copy(s, { awaiting: W('Nothing') }));
        default: return this.notUnderstood(s, ctx);
      }
    }

    // --- Where is my order / never arrived / late ---
    whereIsOrder(order, state, ctx, prefix, text) {
      const s = copy(state, { orderId: order.id });
      const q = text || '';
      if (order.state === OrderState.Cancelled) return this.cancelledOrder(order, s, prefix, has(q, /\b(why|who|how come|reason)\b/));
      const extra = order.state === OrderState.OnTheWay && !order.pickup && order.driverName != null && has(q, /\b(car|vehicle|plate|registration|bike|scooter|who is|name|which driver|what driver)\b/)
        ? [`Your driver is ${order.driverName}` + (order.driverVehicle != null ? `, on a ${order.driverVehicle.split(',')[0].toLowerCase()} (registration ${order.driverVehicle.split(',').slice(1).join(',').trim()}).` : '.')] : [];
      switch (order.state.name) {
        case 'Received': case 'Preparing': case 'OnTheWay': {
          const texts = prefix.concat([this.progressText(order)]).concat(extra);
          if (order.minutesLate > 0) return this.lateOptions(order, texts.concat([`It's running about ${Fmt.minutes(order.minutesLate)} late. I'm sorry about that.`]), s);
          return result(reply('WhereIsOrder', texts, { card: this.orderCard(order), quickReplies: this.stageChips(order), answered: true }), copy(s, { awaiting: W('Nothing') }));
        }
        case 'Delivered':
          return result(reply('WhereIsOrder', prefix.concat([
            `Our records show it was ${order.pickup ? 'collected' : 'delivered'} at ${Fmt.time(order.deliveredAt != null ? order.deliveredAt : order.placedAt)}` +
            (order.pickup ? '.' : ` to ${order.address}.`) + ' Did you get it?']), {
            card: this.orderCard(order),
            quickReplies: [qr(A('Helped'), 'Yes, I got it'), pick('NeverArrived'), pick('MissingItem'), pick('FoodQuality')],
            answered: true,
          }), copy(s, { awaiting: W('Nothing') }));
        default: return this.cancelledOrder(order, s, prefix);
      }
    }

    progressText(order) {
      const left = Fmt.minutes(order.minutesLeft != null ? order.minutesLeft : 1);
      switch (order.state.name) {
        case 'Received': return order.pickup
          ? `${order.restaurantName} has your order and will start on it shortly. It should be ready for pick-up in about ${left}.`
          : `${order.restaurantName} has your order and will start on it shortly. It should reach you in about ${left}.`;
        case 'Preparing': return `${order.restaurantName} is preparing your food now. About ${left} to go.`;
        case 'OnTheWay': return order.pickup ? `Your order is ready for pick-up at ${order.restaurantName}, ${order.restaurantArea}.`
          : `${order.driverName != null ? order.driverName : 'Your driver'} is on the way with your order, about ${left} out.`;
        default: return '';
      }
    }

    lateOptions(order, texts, state) {
      return result(reply('Late', texts.concat(["Because it's late, I can cancel it free of charge, or you can keep waiting."]), {
        card: this.orderCard(order),
        quickReplies: [qr(A('KeepWaiting'), "I'll keep waiting"), qr(A('ConfirmCancel'), 'Cancel it (free)'), human()],
        answered: true,
      }), copy(state, { awaiting: W('LateChoice'), lastProblem: 'Late' }));
    }

    late(order, state, ctx, text) {
      if (order.state.inProgress && order.minutesLate > 0) return this.whereIsOrder(order, state, ctx, []);
      if (order.state.inProgress) {
        return result(reply('Late', [this.progressText(order), "It's still within the promised time. If it goes past that, I can cancel it free of charge."], {
          card: this.orderCard(order), quickReplies: this.stageChips(order), answered: true,
        }), copy(state, { orderId: order.id, awaiting: W('Nothing') }));
      }
      if (order.state === OrderState.Delivered && order.deliveryFee > 0 && has(text || '', /\b(refund|money back|compensat\w*|credit|voucher)\b/)) {
        const e = esc(Guidelines.late, order, `The customer reports that order ${order.id} arrived late and asks for the ${Fmt.money(order.deliveryFee)} delivery fee back.`, { amount: order.deliveryFee, reason: 'Late delivery: delivery fee' });
        return this.refundFlow(e, order, copy(state, { orderId: order.id }), ctx, ["Sorry it took so long. A late delivery can get its delivery fee back, so I'll ask for that."]);
      }
      if (order.state === OrderState.Delivered) {
        return this.escalate('Late', ["Sorry it took so long. I've logged the late delivery so our logistics team can look at what held it up."],
          esc(Guidelines.late, order, `The customer reports that order ${order.id} arrived late.`), copy(state, { orderId: order.id }), ctx, [pick('FoodQuality')]);
      }
      return this.cancelledOrder(order, state, []);
    }

    neverArrived(order, state, ctx, text) {
      const s = copy(state, { orderId: order.id });
      if (order.state === OrderState.Delivered) {
        // The customer already knows it went to someone else: don't ask them to go and look.
        if (has(text || '', /\b(someone else|wrong house|wrong address|wrong person|wrong place|wrong door|neighbour|neighbor|gave (it|my food|my order|the food))\b/)) {
          return this.notReceived(order, copy(s, { awaiting: W('Nothing') }), ctx, true);
        }
        return result(reply('NeverArrived', [
          `I'm sorry. It's marked as ${order.pickup ? 'collected' : 'delivered'} at ${Fmt.time(order.deliveredAt != null ? order.deliveredAt : order.placedAt)}` +
          (order.pickup ? '.' : ` to ${order.address}.`),
          'Before I log it, please check your door, reception or security gate, and ask your neighbours. Drivers sometimes leave orders there.',
        ], { quickReplies: [qr(A('CheckedEverywhere'), "I've checked, it's not there"), qr(A('FoundIt'), 'I found it')] }), copy(s, { awaiting: W('DeliveryCheck') }));
      }
      if (order.state === OrderState.Cancelled) return this.cancelledOrder(order, s, []);
      return this.whereIsOrder(order, s, ctx, ["It hasn't been delivered yet. It's still on its way:"]);
    }

    notReceived(order, state, ctx, wrongPerson) {
      return this.escalate('NeverArrived', [
        wrongPerson ? "I'm sorry, that shouldn't happen. I've opened a \"delivered to the wrong place\" case for our logistics team. They'll check the driver's GPS and drop-off."
          : "Thank you for checking. I've opened a \"delivered but not received\" case for our logistics team. They'll check the driver's GPS and drop-off.",
        `Because you pay by ${order.pay.label} on delivery, you shouldn't have been charged for food you never got. If money did leave your account, tap "I was charged".`,
      ], esc(Guidelines.markedDelivered, order,
        `Order ${order.id} from ${order.restaurantName} is marked delivered at ${Fmt.time(order.deliveredAt != null ? order.deliveredAt : order.placedAt)} ` +
        `to ${order.address}, but the customer ${wrongPerson ? 'says it went to the wrong person or place' : 'checked and never received it'}.`), state, ctx, [qr(A('WasCharged'), 'I was charged')]);
    }

    cancelledOrder(order, state, prefix, why) {
      const texts = prefix.concat([`Your order from ${order.restaurantName} was cancelled. You won't be charged, because you pay on delivery.`]);
      if (why) texts.push("Orders are cancelled when you ask us to, when the restaurant can't make your food, or when no driver is available. If you didn't ask for this, a person can look into it for you.");
      return result(reply('WhereIsOrder', texts, {
        card: this.orderCard(order), quickReplies: [pick('PaymentProblem'), pick('ComplaintStatus')], answered: true,
      }), copy(state, { orderId: order.id, awaiting: W('Nothing') }));
    }

    // --- Missing items ---
    missingItem(order, text, state, ctx) {
      if (order.state !== OrderState.Delivered) return this.notArrivedYet('MissingItem', order, state, ctx);
      const s = copy(state, { orderId: order.id });
      const tamper = has(text, /\b(ate|eaten|eating|tampered|seal was broken|seal broken|broken seal|already opened|was opened|had been opened|bag was open|opened before)\b/);
      const items = this.missingItems(text, order);
      if (items.length) return this.missingFor(order, items, s, tamper);
      // "my order is missing" means the whole order, which is a delivery problem
      if (has(text, /\b(my|the|whole|entire|all my) (order|food|meal|delivery)( is| was| has gone)? missing\b/) && !has(text, /\b(half|part|some|most|bits|parts|pieces)\b/)) return this.neverArrived(order, s, ctx, text);
      return result(reply('MissingItem', [(tamper ? "I'm sorry, an opened bag is serious and I'll flag it too. " : 'Sorry about that. ') +
        'Which item was missing? If more than one, you can type them, e.g. "the coke and the chips".'], {
        quickReplies: this.itemChips(order).concat([qr(A('ChooseItem', { index: -1 }), 'Everything')]),
      }), copy(s, { awaiting: W('MissingWhich', { tamper }) }));
    }

    missingItems(text, order) {
      const idx = this.findItems(text, order);
      if (idx.length === 0) return [];
      if (idx.length === 1) return [{ index: idx[0], qty: this.shortfall(text, order.lines[idx[0]]) }];
      return idx.map((i) => ({ index: i, qty: order.lines[i].qty }));
    }

    /** "I only got 1 kota but ordered 2" -> 1 missing. */
    shortfall(text, line) {
      const n = TextNormaliser.normalise(text);
      const num = '(\\d+|one|two|three|four|five|six)';
      const val = (w) => (/\d/.test(w) ? Number(w) : NUM_WORDS[w]);
      let m = new RegExp(`(?:got|received|came with|there was|there were|only) (?:only )?${num}\\b`).exec(n);
      const got = m ? val(m[1]) : null;
      m = new RegExp(`(?:ordered|asked for|paid for|instead of|out of) ${num}\\b`).exec(n);
      const ordered = m ? val(m[1]) : line.qty;
      if (got !== null && ordered > got) return Math.min(ordered - got, line.qty);
      m = new RegExp(`${num} (?:\\w+ )?(?:is |are |was |were )?missing`).exec(n) || new RegExp(`missing ${num}\\b`).exec(n);
      if (m) return Math.min(Math.max(val(m[1]), 1), line.qty);
      return null;
    }

    missingFor(order, items, state, tamper) {
      if (items.length === 1) {
        const it = items[0]; const line = order.lines[it.index];
        if (it.qty === null && line.qty > 1) return this.chooseMissing(order, it.index, state, tamper);
        return this.missingAction(order, [{ index: it.index, qty: it.qty || line.qty }], state, tamper);
      }
      return this.missingAction(order, items, state, tamper);
    }

    chooseMissing(order, index, state, tamper) {
      const line = order.lines[index];
      if (line.qty > 1) {
        const chips = [];
        for (let q = 1; q <= Math.min(line.qty, 5); q++) chips.push(qr(A('ChooseQty', { qty: q }), String(q)));
        return result(reply('MissingItem', [`You ordered ${line.qty} × ${line.name}. How many were missing?`], { quickReplies: chips }),
          copy(state, { awaiting: W('MissingHowMany', { index, tamper: !!tamper }) }));
      }
      return this.missingAction(order, [{ index, qty: 1 }], state, tamper);
    }

    missingAction(order, items, state, tamper) {
      const list = items.map((it) => { const line = order.lines[it.index]; return { index: it.index, qty: Math.min(Math.max(it.qty, 1), line.qty) }; });
      const amount = list.reduce((sum, it) => sum + unitOf(order.lines[it.index]) * it.qty, 0);
      const names = list.map((it) => { const line = order.lines[it.index]; return it.qty === line.qty ? (line.qty === 1 ? line.name : `${line.qty} × ${line.name}`) : `${it.qty} of your ${line.qty} × ${line.name}`; });
      const texts = [`Sorry, ${list.length === 1 && names[0].includes(' of your ') ? names[0] : 'your ' + listJoin(names)} didn't arrive.`];
      if (tamper) texts.push("Food that's been opened or eaten from is serious, so I'll also flag it to our logistics team.");
      texts.push(`I can ask for a refund of ${Fmt.money(amount)}, or just let ${order.restaurantName} know so they can fix their packing.`);
      return result(reply('MissingItem', texts, {
        quickReplies: [qr(A('ItemRefund'), `Refund ${Fmt.money(amount)}`), qr(A('TellRestaurant'), tamper ? 'Just report it' : 'Just tell the restaurant')],
      }), copy(state, { awaiting: W('MissingAction', { items: list, tamper: !!tamper }) }));
    }

    // --- Wrong order ---
    wrongOrder(order, text, state, ctx) {
      if (order.state !== OrderState.Delivered) return this.notArrivedYet('WrongOrder', order, state, ctx);
      const s = copy(state, { orderId: order.id });
      if (has(text || '', /\b(someone elses?|somebody elses?|not my (food|order|meal)|not mine|whole order|entire order|everything was wrong|all wrong)\b/)) {
        return this.onChoice(A('WholeOrderWrong'), s, ctx);
      }
      const idx = this.wrongItemsFromText(text || '', order);
      if (idx.length) return this.wrongItems(order, idx, s);
      return result(reply('WrongOrder', ['Sorry about that. Was the whole order wrong, or only some items?'], {
        quickReplies: [qr(A('WholeOrderWrong'), 'The whole order'), qr(A('SomeItemsWrong'), 'Only some items')],
      }), copy(s, { awaiting: W('WrongScope') }));
    }

    wrongItemsFromText(text, order) {
      const n = TextNormaliser.normalise(text);
      let m = /instead of (.+)$/.exec(n);
      if (m) { const i = this.findItems(m[1], order); if (i.length) return i; }
      m = /(?:ordered|asked for|wanted) (.+?) (?:but|and) (?:i )?(?:got|received|they sent|it was)/.exec(n);
      if (m) { const i = this.findItems(m[1], order); if (i.length) return i; }
      return this.findItems(text, order);
    }

    wrongItems(order, idx, state) {
      const names = idx.map((i) => order.lines[i].name);
      const amount = idx.reduce((sum, i) => sum + order.lines[i].total, 0);
      return result(reply('WrongOrder', [`Sorry, you were sent the wrong ${listJoin(names)}. If you have allergies, please don't eat food that isn't yours.`,
        `I can ask for a refund of ${Fmt.money(amount)}, or let ${order.restaurantName} know.`], {
        quickReplies: [qr(A('ItemRefund'), `Refund ${Fmt.money(amount)}`), qr(A('TellRestaurant'), 'Just tell the restaurant')],
      }), copy(state, { awaiting: W('WrongAction', { indexes: idx }) }));
    }

    // --- Food quality and safety ---
    foodQuality(order, text, state, ctx) {
      if (this.mentionsSafety(text)) return this.foodSafety(order, text, state, ctx);
      if (order.state !== OrderState.Delivered) return this.notArrivedYet('FoodQuality', order, state, ctx);
      const s = copy(state, { orderId: order.id });
      const kind = this.qualityKind(text);
      const idx = this.findItems(text, order);
      const everything = has(text, /\b(everything|all of it|whole order|the order|my order)\b/);
      const food = has(text, /\b(all the food|whole meal|the food|my food|the meal|my meal|my kos|die kos)\b/);
      const scope = idx.length ? idx : everything ? order.lines.map((_, i) => i) : food ? this.foodLines(order) : [];
      if (kind) return this.chooseQuality(order, kind, s, scope);
      return result(reply('FoodQuality', ["I'm sorry, that's not the standard we expect. What was wrong with it?"], {
        quickReplies: Object.values(QualityKind).map((k) => qr(A('ChooseQuality', { kind: k }), k.label)),
      }), copy(s, { awaiting: W('QualityWhat', { indexes: scope }) }));
    }

    foodLines(order) {
      const food = order.lines.map((l, i) => (DRINK.test(TextNormaliser.normalise(l.name)) ? -1 : i)).filter((i) => i >= 0);
      return food.length ? food : order.lines.map((_, i) => i);
    }

    chooseQuality(order, kind, state, indexes) {
      const idx = indexes || [];
      if (idx.length || order.lines.length === 1) return this.qualityAction(order, kind, idx.length ? idx : [0], state);
      const warn = kind === QualityKind.Undercooked ? "Please don't eat it: undercooked food can make you ill. " : kind === QualityKind.TastesOff ? "If it smells or tastes off, please don't eat it. " : '';
      return result(reply('FoodQuality', [`${warn}Which item was affected?`], {
        quickReplies: this.itemChips(order).concat([qr(A('ChooseItem', { index: -1 }), 'Everything')]),
      }), copy(state, { awaiting: W('QualityWhich', { kind }) }));
    }

    qualityAction(order, kind, indexes, state) {
      const idx = Array.isArray(indexes) ? indexes : [indexes];
      const all = idx.length > 1 && (idx.length === order.lines.length || idx.join() === this.foodLines(order).join());
      const names = all ? (idx.length === order.lines.length ? 'order' : 'food') : listJoin(idx.map((i) => order.lines[i].name));
      const plural = !all && idx.length > 1;
      const first = {
        Cold: `Sorry your ${names} arrived cold.`,
        Spilled: `Sorry your ${names} arrived spilled or damaged.`,
        Undercooked: `Please don't eat your ${names}: undercooked food can make you ill.`,
        TastesOff: `Sorry about your ${names}. If ${plural || all ? 'they smell' : 'it smells'} or taste${plural || all ? '' : 's'} off, please don't eat ${plural || all ? 'them' : 'it'}.`,
      }[kind.name];
      const amount = idx.reduce((sum, i) => sum + order.lines[i].total, 0);
      return result(reply('FoodQuality', [first, `I can ask for a refund of ${Fmt.money(amount)}, or pass your feedback to ${order.restaurantName}.`], {
        quickReplies: [qr(A('ItemRefund'), `Refund ${Fmt.money(amount)}`), qr(A('TellRestaurant'), 'Just tell the restaurant')],
      }), copy(state, { awaiting: W('QualityAction', { kind, indexes: idx }) }));
    }

    foodSafety(order, text, state, ctx) {
      const o = order && order.state === OrderState.Delivered ? order : null;
      return this.escalate('FoodSafety', [
        "I'm really sorry. Your health comes first: if you feel unwell or have signs of an allergic reaction, please get medical help now (10177 for an ambulance, or 112 from a cellphone).",
        "Please keep the food and packaging and take a photo. I've flagged this as Critical, so a person will contact you immediately.",
      ], E(Guidelines.safety.category, Guidelines.safety.subcategory, Severity.Critical, o ? o.id : null, o ? o.restaurantName : null,
        withWords('Possible food safety problem' + (o ? ` with order ${o.id} from ${o.restaurantName}` : '') + '.', text)),
      copy(state, { orderId: o ? o.id : state.orderId, lastProblem: 'FoodSafety' }), ctx);
    }

    notArrivedYet(intent, order, state, ctx) {
      if (order.state === OrderState.Cancelled) return this.cancelledOrder(order, state, []);
      const r = this.whereIsOrder(order, state, ctx, ["Your current order hasn't arrived yet, so let's check where it is first:"]);
      const earlier = ctx.orders.filter((o) => !o.active);
      if (earlier.length === 0) return r;
      return result(copy(r.reply, { quickReplies: r.reply.quickReplies.concat([qr(A('Pick', { intent: 'OrderDetails' }), "It's about an earlier order")]) }),
        copy(r.state, { awaiting: W('OrderChoice', { intent, text: '' }), lastProblem: intent }));
    }

    // --- Refunds and payments ---
    refundStatus(order, state, ctx, text) {
      const withRefund = ctx.complaints.filter((c) => c.refund !== null);
      const c = withRefund.find((x) => state.orderId !== null && x.orderId === state.orderId) || maxBy(withRefund, (x) => x.createdAt);
      if (!c) {
        const texts = ["I can't see a refund request on your account."];
        if (has(text || '', /\b(how long|how many days|when|take|timing|how quickly)\b/)) {
          texts[0] = 'Once a refund is approved, it goes back to your card within 3 to 5 business days (depending on your bank), by bank transfer within 3 to 5 business days, or as eats credit straight away. ' +
            "I can't see a refund request on your account right now.";
        }
        let chips;
        if (order && order.state === OrderState.Delivered) {
          texts.push(`Did something go wrong with your order from ${order.restaurantName}? Refunds are for missing, wrong, damaged or undelivered food.`);
          chips = [pick('MissingItem'), pick('WrongOrder'), pick('FoodQuality'), pick('NeverArrived')];
        } else {
          texts.push("Because you pay on delivery, cancelled or undelivered orders aren't charged, so they don't need a refund.");
          chips = [pick('PaymentProblem'), menu()];
        }
        return result(reply('RefundStatus', texts, { quickReplies: chips, answered: true }), copy(state, { awaiting: W('Nothing') }));
      }
      const refund = c.refund;
      const card = { title: `Refund ${reference(c)}`, rows: [['Amount', Fmt.money(refund.amount)], ['Paid', capFirst(refund.method.label)], ['Status', refund.status.label], ['Complaint', c.status.label]] };
      const s = copy(state, { orderId: c.orderId !== null ? c.orderId : state.orderId, awaiting: W('Nothing') });
      switch (refund.status.name) {
        case 'Requested':
          if (overdue(c, ctx.now)) {
            return result(reply('RefundStatus', [
              `Your refund of ${Fmt.money(refund.amount)} (${reference(c)}) should have been reviewed by ${Fmt.due(c.dueAt, ctx.now)}, and it hasn't been. I'm sorry.`,
              "I've raised it to a supervisor in Finance as High priority. They'll get back to you within 24 hours.",
            ], { card, chaseComplaintId: c.id, quickReplies: [pick('ComplaintStatus')], answered: true }), s);
          }
          return result(reply('RefundStatus', [`Your refund of ${Fmt.money(refund.amount)} (${reference(c)}) is waiting for a support agent to review it. You'll hear back by ${Fmt.due(c.dueAt, ctx.now)}. Once approved, it's paid ${refund.method.label} and arrives ${refund.method.timing}.`],
            { card, quickReplies: [pick('ComplaintStatus')], answered: true }), s);
        case 'Approved':
          return result(reply('RefundStatus', [`Good news: your refund of ${Fmt.money(refund.amount)} has been approved. It's paid ${refund.method.label} and arrives ${refund.method.timing}.`], { card, answered: true }), s);
        case 'Paid':
          return result(reply('RefundStatus', [`Your refund of ${Fmt.money(refund.amount)} has been paid ${refund.method.label}.` +
            (refund.method === RefundMethod.EatsCredit ? " It's ready to use on your next order." : ' Depending on your bank it can take up to 5 business days to show.')], { card, answered: true }), s);
        default:
